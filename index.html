        <div class="cartao__cab"><h2>Digitar o código</h2></div>
        <form id="form-ean">
          <div class="campo">
            <label for="ean-manual">Código de barras</label>
            <input id="ean-manual" type="text" inputmode="numeric" placeholder="Ex.: 7891234567895">
          </div>
          <button type="submit" class="btn btn--bloco" style="margin-top:.8rem">Buscar</button>
        </form>
      </section>`;

    $('#btn-camera').onclick = iniciarCamera;

    const entradaFoto = $('#foto-codigo');
    $('#btn-foto').onclick = () => entradaFoto.click();
    entradaFoto.addEventListener('change', async () => {
      const arquivo = entradaFoto.files && entradaFoto.files[0];
      entradaFoto.value = '';
      if (!arquivo) return;

      const st = $('#foto-status');
      const botao = $('#btn-foto');
      const dizer = (t) => { if (st) st.textContent = t; };
      Scanner.parar();
      botao.disabled = true;

      try {
        // 1º o código de barras: é exato e não custa nada.
        dizer('Procurando código de barras na foto…');
        let codigo = null;
        try { codigo = await Scanner.lerDaImagem(arquivo); } catch (e) {}

        if (codigo) {
          dizer('');
          if (navigator.vibrate) navigator.vibrate(60);
          tratarCodigo(codigo);
          return;
        }

        // 2º a IA, que reconhece a embalagem.
        if (!Store.iaDisponivel()) {
          dizer('');
          toast('Não achei código de barras. Para reconhecer o produto pela foto, ligue o modo nuvem.', 'erro');
          return;
        }

        dizer('Sem código de barras. Perguntando para a IA…');
        const { base64, tipo } = await Scanner.prepararParaIA(arquivo);
        const r = await Store.reconhecerProduto(base64, tipo);
        dizer('');
        if (navigator.vibrate) navigator.vibrate(60);
        usarResultadoIA(r);

      } catch (err) {
        dizer('');
        toast(err.message || 'Não consegui ler essa foto.', 'erro');
      } finally {
        botao.disabled = false;
      }
    });

    $('#form-ean').addEventListener('submit', (e) => {
      e.preventDefault();
      const v = $('#ean-manual').value.trim();
      if (v) tratarCodigo(v);
    });
  }

  async function iniciarCamera() {
    const status = $('#scanner-status');
    const aviso  = $('#scanner-aviso');
    if (aviso) aviso.hidden = true;
    if (status) status.textContent = 'Abrindo a câmera…';

    const modo = await Scanner.iniciar({
      video: $('#scanner-video'),
      onLeitura: (codigo) => {
        Scanner.parar();
        if (navigator.vibrate) navigator.vibrate(60);
        tratarCodigo(codigo);
      },
      onErro: (msg) => {
        if (aviso) aviso.hidden = false;
        if (status) status.textContent = '';
        toast(msg, 'erro');
      }
    });

    if (modo && status) status.textContent = 'Aproxime até o código preencher a mira…';
  }

  /** Abre o cadastro com o que a IA reconheceu, para o usuário conferir. */
  function usarResultadoIA(r) {
    const aviso = {
      alta:  `Reconhecido: ${r.nome}`,

      baixa: 'A foto estava difícil. Confira tudo antes de salvar.'

    toast(aviso, r.confianca === 'baixa' ? 'erro' : 'ok');

    formItem({
      nome: r.nome,
      quantidade: r.quantidade,
      unidade: r.unidade,
      categoria: r.categoria,
      validade: r.validade || null
    });

  /** Monta a folha e chama a impressão do sistema.
   *  Agrupa por categoria porque é assim que o mercado é organizado —
   *  não adianta ficar indo e voltando entre corredores. */
  function imprimirLista(lista) {
    const ORDEM = ['Alimentos', 'Bebidas', 'Limpeza', 'Higiene', 'Pet', 'Outros'];

    const linhas = lista.map((c) => {
      const item = c.item_id ? itens.find((i) => i.id === c.item_id) : null;
      let obs = 'você adicionou';
      if (item) {
        // Quanto tem agora e a partir de quanto é pra repor: decide na gôndola.
        obs = `tem ${qtd(Store.num(item.quantidade))} ${item.unidade}`
            + ` · mínimo ${qtd(Store.num(item.minimo))}`;
      }
      /* O nome guardado na lista é o de quando o item entrou nela — se o produto
         foi renomeado depois, fica velho. Na folha vale o nome atual do estoque. */
      return { nome: (item && item.nome) || c.nome, categoria: item ? item.categoria : 'Outros', obs };
    });

    const grupos = ORDEM
      .map((cat) => ({ cat, itens: linhas.filter((l) => l.categoria === cat) }))
      .filter((g) => g.itens.length);

    const agora = new Date();
    const data = agora.toLocaleDateString('pt-BR');
    const hora = agora.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });

    let folha = document.getElementById('folha-impressao');
    if (!folha) {
      folha = document.createElement('div');
      folha.id = 'folha-impressao';
      document.body.appendChild(folha);
    }
    folha.innerHTML = `
      <h1>Lista de compras</h1>
      <p class="fi-sub">${esc(Store.casa?.nome || 'Minha casa')} · ${data} às ${hora} · ${lista.length} ${lista.length === 1 ? 'item' : 'itens'}</p>
      ${grupos.map((g) => `
        <h2>${esc(g.cat)}</h2>
        <ul>
          ${g.itens.map((l) => `
            <li><span class="fi-nome">${esc(l.nome)}</span><span class="fi-obs">${esc(l.obs)}</span></li>
          `).join('')}
        </ul>`).join('')}
      <p class="fi-rodape">Estoque de Casa</p>`;

    /* No iPhone em modo app instalado o window.print() às vezes não abre nada.
       Se em 1,2 s a tela não tiver mudado, avisa e oferece o copiar. */
    let abriu = false;
    const marcar = () => { abriu = true; };
    window.addEventListener('beforeprint', marcar, { once: true });

    try {
      window.print();
    } catch (e) {
      toast('Este aparelho não abriu a impressão. Use "Copiar lista".', 'erro');
      return;
    }

    setTimeout(() => {
      window.removeEventListener('beforeprint', marcar);
      if (!abriu && !window.matchMedia('print').matches) {
        toast('Se nada abriu, use "Copiar lista" e imprima pelo Notas.', 'aviso');
      }
    }, 1200);
  }

            <label>Código de convite</label>
            <input type="text" readonly value="${esc(convite)}" id="cod-convite" style="font-weight:700;letter-spacing:.1em">
            <div class="dica">Passe este código para quem mora com você usar no cadastro.</div>
          </div>` : ''}
        ${Store.modo === 'local' ? `
          <div class="dica" style="margin-top:.8rem">
            O app está em <strong>modo local</strong>: os dados ficam só neste aparelho.
            Para usar com mais pessoas, configure o Supabase (veja o README).
          </div>` : ''}
      </section>

      <section class="cartao">
        <div class="cartao__cab"><h2>Conta</h2></div>
        ${Store.modo === 'supabase' ? `
          <div style="display:grid;gap:.6rem">
            <div class="dica" style="margin:0 0 .2rem">
              Conectado como <strong>${esc(Store.usuario?.email || Store.usuario?.nome || '')}</strong>
            </div>
            <button type="button" class="btn btn--bloco" id="btn-senha">Trocar minha senha</button>
            <button type="button" class="btn btn--bloco" id="btn-sair">Sair da conta</button>
          </div>` : `
          <div class="dica" style="margin:0">
            Sem cadastro neste modo. Os dados ficam guardados apenas neste aparelho.
          </div>`}
      </section>`;

    graficoCategoria(movs);
    graficoTop(movs);
    resumoSituacao();

    $('#cfg-salvar').onclick = async () => {
      config = await Store.salvarConfig({
        diasAlertaValidade: Math.max(0, parseInt($('#cfg-dias').value, 10) || 0),
        tema: $('#cfg-tema').value
      });
      const nome = $('#cfg-casa').value.trim();
      if (nome && nome !== Store.casa?.nome) await Store.renomearCasa(nome);
      aplicarTema();
      pintarCabecalho();
      toast('Configurações salvas.', 'ok');
      await render();
    };

    $$('[data-csv]').forEach((b) => { b.onclick = () => exportarCSV(b.dataset.csv); });

    const sair = $('#btn-sair');
    if (sair) sair.onclick = async () => { await Store.sair(); location.reload(); };

    const trocar = $('#btn-senha');
    if (trocar) trocar.onclick = formTrocarSenha;
  }

  /* ---------------- trocar senha (logado) ---------------- */

  function formTrocarSenha() {
    abrirModal('Trocar minha senha', `
      <div class="campo">
        <label for="ts-senha">Nova senha</label>
        <input id="ts-senha" type="password" autocomplete="new-password" minlength="6"
               placeholder="Mínimo de 6 caracteres">
      </div>
      <div class="campo">
        <label for="ts-senha2">Repita a nova senha</label>
        <input id="ts-senha2" type="password" autocomplete="new-password" minlength="6">
      </div>
      <div class="modal__rodape">
        <button type="button" class="btn" data-fechar>Cancelar</button>
        <button type="button" class="btn btn--primario" id="ts-ok">Salvar</button>
      </div>`, (w) => {
      w.querySelector('#ts-ok').onclick = async () => {
        const a = w.querySelector('#ts-senha').value;
        const b = w.querySelector('#ts-senha2').value;
        if (a !== b) { toast('As duas senhas não são iguais.', 'erro'); return; }
        try {
          await Store.trocarSenha(a);
          fecharModal();
          toast('Senha alterada.', 'ok');
        } catch (err) { toast(err.message, 'erro'); }
      };
    });
  }

  function resumoSituacao() {
    const cont = { ok: 0, vencendo: 0, baixo: 0, falta: 0, vencido: 0 };
    itens.forEach((i) => cont[situacao(i)]++);
    const total = itens.length || 1;
    const linhas = [
      ['ok', 'Ok', 'var(--ok)'],
      ['vencendo', 'Vence logo', 'var(--aviso)'],
      ['baixo', 'Acabando', 'var(--alerta)'],
      ['falta', 'Em falta', 'var(--grave)'],
      ['vencido', 'Vencido', 'var(--grave)']
    ].filter(([k]) => cont[k] > 0);

    $('#resumo-situacao').innerHTML = linhas.length ? `
      <table class="tabela-dados">
        <thead><tr><th>Situação</th><th>Itens</th></tr></thead>
        <tbody>
          ${linhas.map(([k, rot, cor]) => `
            <tr>
              <td><span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:${cor};margin-right:.5rem"></span>${rot}</td>
              <td>${cont[k]} <span style="color:var(--text-3)">(${Math.round(cont[k] / total * 100)}%)</span></td>
            </tr>`).join('')}
        </tbody>
      </table>` : '<p style="color:var(--text-2);font-size:.88rem;margin:0">Nenhum item cadastrado.</p>';
  }

  /* ---------------- gráficos ---------------- */

  function cor(nome) {
    return getComputedStyle(document.documentElement).getPropertyValue(nome).trim();
  }

  function baseChart() {
    const texto2 = cor('--text-2');
    const linha  = cor('--border');
    return {
      responsive: true,
      maintainAspectRatio: false,
      animation: { duration: 240 },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: cor('--text-1'),
          titleColor: cor('--surface-1'),
          bodyColor: cor('--surface-1'),
          padding: 10, cornerRadius: 8, displayColors: true, boxPadding: 4
        }
      },
      scales: {
        x: { grid: { display: false }, border: { color: linha },
             ticks: { color: texto2, font: { size: 11 } } },
        y: { beginAtZero: true, grid: { color: linha, drawTicks: false },
             border: { display: false },
             ticks: { color: texto2, font: { size: 11 }, precision: 0 } }
      }
    };
  }

  function ultimosMeses(n) {
    const saida = [];
    const d = new Date();
    d.setDate(1);
    for (let i = n - 1; i >= 0; i--) {
      const m = new Date(d.getFullYear(), d.getMonth() - i, 1);
      saida.push({
        chave: `${m.getFullYear()}-${String(m.getMonth() + 1).padStart(2, '0')}`,
        rotulo: m.toLocaleDateString('pt-BR', { month: 'short' }).replace('.', '')
      });
    }
    return saida;
  }

  function graficoCategoria(movs) {
    const caixa = $('#g-categoria');
    if (!caixa || typeof window.Chart !== 'function') { semGrafico('#g-categoria', '#leg-categoria'); return; }

    const meses = ultimosMeses(6);
    const porCat = {};
    CATEGORIAS.forEach((c) => { porCat[c] = meses.map(() => 0); });

    movs.filter((m) => m.tipo === 'saida').forEach((m) => {
      const item = itens.find((i) => i.id === m.item_id);
      const cat = item?.categoria || 'Outros';
      const chave = String(m.data).slice(0, 7);
      const idx = meses.findIndex((x) => x.chave === chave);
      if (idx >= 0 && porCat[cat]) porCat[cat][idx] += Store.num(m.quantidade);
    });

    const ativas = CATEGORIAS.filter((c) => porCat[c].some((v) => v > 0));
    if (!ativas.length) { semGrafico('#g-categoria', '#leg-categoria', 'Ainda não há saídas registradas.'); return; }

    const superficie = cor('--surface-1');
    const datasets = ativas.map((c, k) => ({
      label: c,
      data: porCat[c],
      backgroundColor: cor(CORES_SERIE[CATEGORIAS.indexOf(c) % CORES_SERIE.length]),
      borderColor: superficie,
      borderWidth: 2,
      borderRadius: 4,
      borderSkipped: false,
      maxBarThickness: 44
    }));

    graficos.push(new window.Chart(caixa, {
      type: 'bar',
      data: { labels: meses.map((m) => m.rotulo), datasets },
      options: Object.assign(baseChart(), {
        scales: {
          x: { stacked: true, grid: { display: false }, border: { color: cor('--border') },
               ticks: { color: cor('--text-2'), font: { size: 11 } } },
          y: { stacked: true, beginAtZero: true, grid: { color: cor('--border'), drawTicks: false },
               border: { display: false },
               ticks: { color: cor('--text-2'), font: { size: 11 }, precision: 0 } }
        }
      })
    }));

    $('#leg-categoria').innerHTML = ativas.map((c) =>
      `<span><i style="background:${cor(CORES_SERIE[CATEGORIAS.indexOf(c) % CORES_SERIE.length])}"></i>${esc(c)}</span>`
    ).join('');

    $('#tab-categoria').innerHTML = `
      <div class="rolagem-x"><table class="tabela-dados">
        <thead><tr><th>Categoria</th>${meses.map((m) => `<th>${m.rotulo}</th>`).join('')}</tr></thead>
        <tbody>${ativas.map((c) => `<tr><td>${esc(c)}</td>${porCat[c].map((v) => `<td>${qtd(v)}</td>`).join('')}</tr>`).join('')}</tbody>
      </table></div>`;
  }

  function graficoTop(movs) {
    const caixa = $('#g-top');
    if (!caixa || typeof window.Chart !== 'function') { semGrafico('#g-top'); return; }

    const soma = {};
    movs.filter((m) => m.tipo === 'saida').forEach((m) => {
      const nome = m.item_nome || 'Item';
      soma[nome] = (soma[nome] || 0) + Store.num(m.quantidade);
    });

    const top = Object.entries(soma).sort((a, b) => b[1] - a[1]).slice(0, 8);
    if (!top.length) { semGrafico('#g-top', null, 'Ainda não há saídas registradas.'); return; }

    graficos.push(new window.Chart(caixa, {
      type: 'bar',
      data: {
        labels: top.map(([n]) => n.length > 22 ? n.slice(0, 21) + '…' : n),
        datasets: [{
          data: top.map(([, v]) => v),
          backgroundColor: cor('--series-1'),
          borderRadius: 4,
          borderSkipped: false,
          barThickness: 'flex',
          maxBarThickness: 22
        }]
      },
      options: Object.assign(baseChart(), {
        indexAxis: 'y',
        scales: {
          x: { beginAtZero: true, grid: { color: cor('--border'), drawTicks: false },
               border: { display: false },
               ticks: { color: cor('--text-2'), font: { size: 11 }, precision: 0 } },
          y: { grid: { display: false }, border: { color: cor('--border') },
               ticks: { color: cor('--text-2'), font: { size: 11 } } }
        }
      })
    }));

    $('#tab-top').innerHTML = `
      <table class="tabela-dados">
        <thead><tr><th>Item</th><th>Consumo</th></tr></thead>
        <tbody>${top.map(([n, v]) => `<tr><td>${esc(n)}</td><td>${qtd(v)}</td></tr>`).join('')}</tbody>
      </table>`;
  }

  function semGrafico(sel, selLeg, msg = 'Gráfico indisponível.') {
    const c = $(sel);
    if (c && c.parentElement) {
      c.parentElement.innerHTML =
        `<div class="vazio" style="padding:1.2rem"><p style="margin:0">${esc(msg)}</p></div>`;
    }
    if (selLeg) { const l = $(selLeg); if (l) l.innerHTML = ''; }
  }

  /* ---------------- CSV ---------------- */

  function csvEscapa(v) {
    const s = String(v ?? '');
    return /[";\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }

  async function exportarCSV(tipo) {
    let linhas, nome;

    if (tipo === 'estoque') {
      nome = 'estoque';
      linhas = [['Nome','Categoria','Local','Quantidade','Unidade','Mínimo','Validade','Código de barras','Situação','Observações']];
      itens.forEach((i) => linhas.push([
        i.nome, i.categoria, i.local, i.quantidade, i.unidade, i.minimo,
        i.validade ? dataBR(i.validade) : '', i.ean || '', ROTULO_SIT[situacao(i)], i.observacoes || ''
      ]));
    } else {
      nome = 'movimentacoes';
      const movs = await Store.listarMovimentos();
      linhas = [['Data','Item','Tipo','Quantidade','Saldo depois','Motivo','Quem']];
      movs.forEach((m) => linhas.push([
        dataHoraBR(m.data), m.item_nome || '', m.tipo, m.quantidade, m.saldo ?? '',
        m.motivo || '', m.usuario_nome || ''
      ]));
    }

    // ';' como separador e BOM: abre certinho no Excel em português.
    const csv = '﻿' + linhas.map((l) => l.map(csvEscapa).join(';')).join('\r\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${nome}-${hojeISO()}.csv`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    toast('Arquivo gerado.', 'ok');
  }

  /* ---------------- tema e cabeçalho ---------------- */

  function aplicarTema() {
    const t = config.tema || 'auto';
    if (t === 'auto') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', t);
  }

  function pintarCabecalho() {
    const casa = $('#topo-casa');
    const sub  = $('#topo-sub');
    const selo = $('#selo-modo');
    if (casa) casa.textContent = Store.casa?.nome || 'Minha casa';
    if (sub)  sub.textContent  = Store.modo === 'supabase'
      ? (Store.usuario?.nome || 'Estoque de Casa') : 'Estoque de Casa';
    if (selo) {
      selo.textContent = Store.modo === 'supabase' ? 'nuvem' : 'local';
      selo.title = Store.modo === 'supabase'
        ? 'Dados sincronizados na nuvem'
        : 'Dados guardados somente neste aparelho';
    }
  }

  /* ---------------- login ---------------- */

  function montarLogin() {
    document.body.classList.add('sem-nav');
    $('#tela-login').hidden = false;
    $('#app').hidden = true;

    let aba = 'entrar';
    const abaEntrar = $('#aba-entrar'), abaCriar = $('#aba-criar');
    const erro = $('#login-erro');

    function trocar(nova) {
      aba = nova;
      abaEntrar.setAttribute('aria-selected', String(nova === 'entrar'));
      abaCriar.setAttribute('aria-selected', String(nova === 'criar'));
      $('#campo-nome').hidden   = nova === 'entrar';
      $('#campo-senha2').hidden = nova === 'entrar';
      $('#bloco-casa').hidden   = nova === 'entrar';
      $('#btn-esqueci').hidden  = nova !== 'entrar';
      $('#btn-login').textContent = nova === 'entrar' ? 'Entrar' : 'Criar conta';
      $('#in-senha').setAttribute('autocomplete', nova === 'entrar' ? 'current-password' : 'new-password');
      erro.hidden = true;
    }
    abaEntrar.onclick = () => trocar('entrar');
    abaCriar.onclick  = () => trocar('criar');

    // olho: mostrar/ocultar a senha
    const olho = $('#btn-olho');
    olho.onclick = () => {
      const campo = $('#in-senha');
      const vendo = campo.type === 'text';
      campo.type = vendo ? 'password' : 'text';
      olho.textContent = vendo ? '👁' : '🙈';
      olho.setAttribute('aria-label', vendo ? 'Mostrar senha' : 'Ocultar senha');
    };

    // esqueci minha senha
    $('#btn-esqueci').onclick = async () => {
      const email = $('#in-email').value.trim();
      if (!email) {
        erro.textContent = 'Digite seu e-mail acima e toque de novo em "Esqueci minha senha".';
        erro.hidden = false;
        $('#in-email').focus();
        return;
      }
      try {
        await Store.pedirResetSenha(email);
        erro.hidden = true;
        toast('Enviamos um link para ' + email + '. Abra o e-mail para criar uma senha nova.', 'ok');
      } catch (err) {
        erro.textContent = err.message; erro.hidden = false;
      }
    };

    // veio do link do e-mail: mostrar direto a criação da nova senha
    if (Store.recuperandoSenha) mostrarNovaSenha();

    function mostrarNovaSenha() {
      $('#form-login').hidden = true;
      $('#btn-esqueci').hidden = true;
      document.querySelector('.abas').hidden = true;
      $('#caixa-nova-senha').hidden = false;

      const nsErro = $('#ns-erro');
      $('#ns-salvar').onclick = async () => {
        const a = $('#ns-senha').value, b = $('#ns-senha2').value;
        nsErro.hidden = true;
        if (a !== b) { nsErro.textContent = 'As duas senhas não são iguais.'; nsErro.hidden = false; return; }
        try {
          await Store.trocarSenha(a);
          history.replaceState(null, '', location.pathname);
          await abrirApp();
        } catch (err) { nsErro.textContent = err.message; nsErro.hidden = false; }
      };
    }

    $('#form-login').addEventListener('submit', async (e) => {
      e.preventDefault();
      erro.hidden = true;
      const btn = $('#btn-login');
      btn.disabled = true;
      const original = btn.textContent;
      btn.textContent = 'Aguarde…';

      try {
        const email = $('#in-email').value.trim();
        const senha = $('#in-senha').value;
        if (!email || senha.length < 6) throw new Error('Informe o e-mail e uma senha de pelo menos 6 caracteres.');

        let r;
        if (aba === 'entrar') {
          r = await Store.entrar(email, senha);
        } else {
          if (senha !== $('#in-senha2').value) throw new Error('As duas senhas não são iguais.');
          r = await Store.cadastrar({
            email, senha,
            nome: $('#in-nome').value.trim(),
            nomeCasa: $('#in-casa').value.trim(),
            codigoConvite: $('#in-convite').value.trim()
          });
          if (r?.precisaConfirmarEmail) {
            throw new Error('Enviamos um e-mail de confirmação. Confirme e depois faça login.');
          }
        }
        if (!r) throw new Error('Não foi possível entrar. Tente novamente.');
        await abrirApp();
      } catch (err) {
        erro.textContent = err.message;
        erro.hidden = false;
      } finally {
        btn.disabled = false;
        btn.textContent = original;
      }
    });
  }

  async function abrirApp() {
    document.body.classList.remove('sem-nav');
    $('#tela-login').hidden = true;
    $('#app').hidden = false;
    config = await Store.lerConfig();
    aplicarTema();
    pintarCabecalho();
    await irPara('inicio');
    oferecerMigracao();
  }

  /** Primeiro login na nuvem com estoque guardado no aparelho: oferece subir. */
  function oferecerMigracao() {
    if (Store.modo !== 'supabase' || Store.jaImportou()) return;
    const quantos = Store.contarItensLocais();
    if (!quantos) return;

    abrirModal('Trazer o estoque deste aparelho?', `
      <p>Encontramos <strong>${quantos} ${quantos === 1 ? 'item' : 'itens'}</strong>
         guardados neste aparelho, de quando o app funcionava sem cadastro.</p>
      <p style="color:var(--text-2);font-size:.9rem">
         Quer enviar tudo para a sua casa na nuvem? O histórico vai junto.
         Itens com o mesmo nome não são duplicados.</p>
      <div class="modal__rodape">
        <button type="button" class="btn" id="mg-nao">Agora não</button>
        <button type="button" class="btn btn--primario" id="mg-sim">Enviar</button>
      </div>`, (w) => {
      w.querySelector('#mg-nao').onclick = () => {
        Store.marcarImportacaoDispensada();
        fecharModal();
      };
      w.querySelector('#mg-sim').onclick = async () => {
        const btn = w.querySelector('#mg-sim');
        btn.disabled = true; btn.textContent = 'Enviando…';
        try {
          const r = await Store.importarLocalParaNuvem();
          fecharModal();
          toast(`${r.itens} ${r.itens === 1 ? 'item enviado' : 'itens enviados'}.`, 'ok');
          await render();
        } catch (err) {
          btn.disabled = false; btn.textContent = 'Enviar';
          toast(err.message, 'erro');
        }
      };
    });
  }

  /* ---------------- eventos globais ---------------- */

  function ligarEventos() {
    $$('.nav button').forEach((b) => {
      b.onclick = () => irPara(b.dataset.tela);
    });

    document.addEventListener('click', async (e) => {
      const t = e.target;

      const ir = t.closest('[data-ir]');
      if (ir) { await irPara(ir.dataset.ir); return; }

      const f = t.closest('[data-filtro]');
      if (f) { await irPara('estoque', { filtroSituacao: f.dataset.filtro }); return; }

      if (t.closest('[data-novo-item]')) { formItem(); return; }
      if (t.closest('[data-baixa-rapida]')) { escolherParaBaixa(); return; }

      const sit = t.closest('[data-sit]');
      if (sit) {
        filtro.situacao = sit.dataset.sit;
        $$('.chip').forEach((c) => c.setAttribute('aria-pressed', String(c.dataset.sit === filtro.situacao)));
        renderListaEstoque();
        return;
      }

      const abrir = t.closest('[data-abrir-item]');
      if (abrir) { await detalheItem(abrir.dataset.abrirItem); return; }

      const mais = t.closest('[data-mais]');
      if (mais) { await passoRapido(mais.dataset.mais, 1); return; }

      const menos = t.closest('[data-menos]');
      if (menos) { await passoRapido(menos.dataset.menos, -1); return; }

      const tirar = t.closest('[data-tirar]');
      if (tirar) {
        await Store.removerCompra(tirar.dataset.tirar);
        toast('Removido da lista.');
        await render();
        return;
      }
    });

    document.addEventListener('change', async (e) => {
      const cb = e.target.closest('[data-comprado]');
      if (cb) { cb.checked = false; await marcarComprado(cb.dataset.comprado); }
    });

    document.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter' && e.key !== ' ') return;
      const alvo = e.target.closest('[data-abrir-item], [data-baixa]');
      if (alvo) { e.preventDefault(); alvo.click(); }
    });

    // Para a câmera ao sair da aba de escanear ou minimizar o app.
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) Scanner.parar();
    });
  }

  /* ---------------- início ---------------- */

  async function iniciar() {
    ligarEventos();

    try {
      await Store.init();
    } catch (e) {
      console.error(e);
      toast('Erro ao iniciar. Rodando em modo local.', 'erro');
    }

    config = await Store.lerConfig();
    aplicarTema();

    if (Store.modo === 'supabase' && !Store.usuario) montarLogin();
    else await abrirApp();

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  }

  return { iniciar };
})();

document.addEventListener('DOMContentLoaded', () => App.iniciar());

</script>
