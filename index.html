  --sombra: 0 1px 2px rgba(0,0,0,.4), 0 4px 12px rgba(0,0,0,.3);
}

* { box-sizing: border-box; }

html, body {
  margin: 0; padding: 0;
  background: var(--surface-0);
  color: var(--text-1);
  font-family: var(--fonte);
  font-size: 16px;
  line-height: 1.45;
  -webkit-text-size-adjust: 100%;
}

body { padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px)); }
body.sem-nav { padding-bottom: 0; }

h1, h2, h3 { margin: 0; font-weight: 650; line-height: 1.25; }
h1 { font-size: 1.25rem; }
h2 { font-size: 1.05rem; }
h3 { font-size: .95rem; }
p  { margin: 0 0 .6rem; }
[hidden] { display: none !important; }

/* ---------- cabeçalho ---------- */

.topo {
  position: sticky; top: 0; z-index: 30;
  display: flex; align-items: center; gap: .6rem;
  padding: calc(.7rem + env(safe-area-inset-top, 0px)) 1rem .7rem;
  background: var(--surface-1);
  border-bottom: 1px solid var(--border);
}
.topo__titulo { flex: 1; min-width: 0; }
.topo__titulo small { display: block; color: var(--text-2); font-size: .78rem; font-weight: 400; }
.topo__titulo strong { display: block; font-size: 1.1rem; font-weight: 650;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.selo {
  font-size: .68rem; font-weight: 600; letter-spacing: .02em;
  padding: .2rem .5rem; border-radius: 999px;
  background: var(--surface-2); color: var(--text-2);
  border: 1px solid var(--border);
}

/* ---------- layout ---------- */

main { padding: 1rem; max-width: 720px; margin: 0 auto; }
.pilha > * + * { margin-top: 1rem; }

.cartao {
  background: var(--surface-1);
  border: 1px solid var(--border);
  border-radius: var(--raio);
  box-shadow: var(--sombra);
  padding: 1rem;
}
.cartao__cab { display: flex; align-items: center; justify-content: space-between; gap: .5rem; margin-bottom: .75rem; }
.cartao__cab h2 { font-size: 1rem; }

.secao-titulo {
  font-size: .78rem; font-weight: 650; text-transform: uppercase;
  letter-spacing: .05em; color: var(--text-3); margin: 1.25rem 0 .5rem;
}

/* ---------- KPIs ---------- */

.kpis { display: grid; grid-template-columns: repeat(2, 1fr); gap: .7rem; }
@media (min-width: 560px) { .kpis { grid-template-columns: repeat(4, 1fr); } }

.kpi {
  background: var(--surface-1); border: 1px solid var(--border);
  border-radius: var(--raio); padding: .85rem; text-align: left;
  box-shadow: var(--sombra); cursor: pointer; font: inherit; color: inherit;
}
.kpi:disabled { cursor: default; }
.kpi__valor { font-size: 1.9rem; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.kpi__rotulo { font-size: .78rem; color: var(--text-2); margin-top: .3rem; }
.kpi--ok    .kpi__valor { color: var(--ok); }
.kpi--aviso .kpi__valor { color: var(--aviso); }
.kpi--alerta .kpi__valor { color: var(--alerta); }
.kpi--grave .kpi__valor { color: var(--grave); }

/* ---------- botões ---------- */

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .45rem;
  min-height: 48px; padding: .7rem 1.1rem;
  border-radius: var(--raio-sm); border: 1px solid var(--border-forte);
  background: var(--surface-1); color: var(--text-1);
  font: inherit; font-weight: 600; cursor: pointer;
  transition: filter .12s ease, background .12s ease;
  -webkit-tap-highlight-color: transparent;
}
.btn:hover { filter: brightness(.97); }
.btn:active { transform: translateY(1px); }
.btn:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }
.btn--primario { background: var(--brand); border-color: var(--brand); color: var(--sobre-brand); }
.btn--primario:hover { background: var(--brand-forte); filter: none; }
.btn--perigo { color: var(--grave); border-color: var(--grave); background: transparent; }
.btn--bloco { width: 100%; }
.btn--pequeno { min-height: 38px; padding: .4rem .7rem; font-size: .85rem; }
.btn--fantasma { border-color: transparent; background: transparent; color: var(--brand); }

.acoes-rapidas { display: grid; grid-template-columns: 1fr 1fr; gap: .7rem; }
.acao-grande {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .35rem;
  min-height: 92px; border-radius: var(--raio);
  border: 1px solid var(--border); background: var(--surface-1);
  color: var(--text-1); font: inherit; font-weight: 600; cursor: pointer;
  box-shadow: var(--sombra);
}
.acao-grande--destaque { background: var(--brand); border-color: var(--brand); color: var(--sobre-brand); }
.acao-grande .ico { font-size: 1.6rem; line-height: 1; }
.acao-grande small { font-weight: 400; font-size: .72rem; opacity: .85; }

/* ---------- formulários ---------- */

label { display: block; font-size: .82rem; font-weight: 600; color: var(--text-2); margin-bottom: .3rem; }
input, select, textarea {
  width: 100%; min-height: 48px; padding: .6rem .75rem;
  border: 1px solid var(--border-forte); border-radius: var(--raio-sm);
  background: var(--surface-1); color: var(--text-1);
  font: inherit; font-size: 1rem;
}
textarea { min-height: 72px; resize: vertical; }
input:focus, select:focus, textarea:focus { outline: 3px solid var(--brand); outline-offset: 1px; border-color: var(--brand); }
.campo + .campo { margin-top: .85rem; }
.linha { display: grid; grid-template-columns: 1fr 1fr; gap: .7rem; }
.dica { font-size: .76rem; color: var(--text-3); margin-top: .3rem; }

/* campo com botão embutido (senha com olho) */
.com-botao { position: relative; }
.com-botao input { padding-right: 3.1rem; }
.olho {
  position: absolute; right: .3rem; top: 50%; transform: translateY(-50%);
  width: 42px; height: 42px; border: 0; border-radius: 50%;
  background: transparent; cursor: pointer; font-size: 1.1rem; line-height: 1;
}
.olho:hover { background: var(--surface-2); }

.busca { position: relative; }
.busca input { padding-left: 2.4rem; }
.busca .ico { position: absolute; left: .8rem; top: 50%; transform: translateY(-50%); color: var(--text-3); }

.chips { display: flex; gap: .4rem; overflow-x: auto; padding: .1rem 0 .3rem; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: 0 0 auto; padding: .4rem .8rem; border-radius: 999px;
  border: 1px solid var(--border-forte); background: var(--surface-1);
  color: var(--text-2); font-size: .82rem; font-weight: 600; cursor: pointer;
  min-height: 36px;
}
.chip[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: var(--sobre-brand); }

/* ---------- lista de itens ---------- */

.lista { list-style: none; margin: 0; padding: 0; }
.lista > li + li { margin-top: .55rem; }

.item {
  display: flex; align-items: center; gap: .55rem;
  background: var(--surface-1); border: 1px solid var(--border);
  border-left: 4px solid var(--border-forte);
  border-radius: var(--raio); padding: .7rem .7rem .7rem .8rem;
  box-shadow: var(--sombra);
}
.item--ok       { border-left-color: var(--ok); }
.item--vencendo { border-left-color: var(--aviso); }
.item--baixo    { border-left-color: var(--alerta); }
.item--falta,
.item--vencido  { border-left-color: var(--grave); }

.item__info { flex: 1; min-width: 0; cursor: pointer; }
.item__nome { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item__meta { font-size: .78rem; color: var(--text-2); margin-top: .15rem;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item__qtd { text-align: right; font-variant-numeric: tabular-nums; min-width: 44px; }
.item__qtd b { display: block; font-size: 1.15rem; font-weight: 700; }
.item__qtd span { font-size: .72rem; color: var(--text-2); }

.item__botoes { display: flex; gap: .3rem; }
.redondo {
  width: 42px; height: 42px; flex: 0 0 42px; border-radius: 50%;
  border: 1px solid var(--border-forte); background: var(--surface-2);
  color: var(--text-1); font-size: 1.35rem; font-weight: 700; line-height: 1;
  display: grid; place-items: center; cursor: pointer;
}
.redondo:hover { filter: brightness(.95); }
.redondo:disabled { opacity: .35; cursor: not-allowed; }
.redondo--mais { background: var(--brand); border-color: var(--brand); color: var(--sobre-brand); }

.tag {
  display: inline-block; font-size: .68rem; font-weight: 700;
  padding: .1rem .42rem; border-radius: 999px; margin-right: .35rem;
  vertical-align: baseline;
}
.tag--baixo    { background: var(--alerta-bg); color: var(--alerta); }
.tag--falta    { background: var(--grave-bg);  color: var(--grave); }
.tag--vencendo { background: var(--aviso-bg);  color: var(--aviso); }
.tag--vencido  { background: var(--grave-bg);  color: var(--grave); }

/* ---------- lista de compras ---------- */

.compra { display: flex; align-items: center; gap: .75rem;
  background: var(--surface-1); border: 1px solid var(--border);
  border-radius: var(--raio); padding: .7rem .85rem; box-shadow: var(--sombra); }
.compra__nome { flex: 1; min-width: 0; font-weight: 600;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.compra__nome small { display: block; font-weight: 400; font-size: .75rem; color: var(--text-2);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.caixa { width: 30px; height: 30px; flex: 0 0 30px; accent-color: var(--brand); cursor: pointer; min-height: 0; }

/* ---------- histórico ---------- */

.mov { display: flex; align-items: baseline; gap: .6rem; padding: .55rem 0; border-bottom: 1px solid var(--border); font-size: .88rem; }
.mov:last-child { border-bottom: 0; }
.mov__qtd { font-weight: 700; font-variant-numeric: tabular-nums; min-width: 54px; text-align: right; }
.mov__qtd--entrada { color: var(--ok); }
.mov__qtd--saida   { color: var(--alerta); }
.mov__qtd--ajuste  { color: var(--text-2); }
.mov__nome { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mov__data { font-size: .74rem; color: var(--text-3); white-space: nowrap; }

/* ---------- gráficos ---------- */

.grafico-caixa { position: relative; height: 240px; }
.legenda { display: flex; flex-wrap: wrap; gap: .5rem .9rem; margin-top: .7rem; font-size: .78rem; color: var(--text-2); }
.legenda span { display: inline-flex; align-items: center; gap: .35rem; }
.legenda i { width: 11px; height: 11px; border-radius: 3px; display: inline-block; }

/* ---------- vazio ---------- */

.vazio { text-align: center; padding: 2.2rem 1rem; color: var(--text-2); }
.vazio .ico { font-size: 2.6rem; display: block; margin-bottom: .5rem; opacity: .55; }
.vazio h3 { margin-bottom: .3rem; color: var(--text-1); }

/* ---------- navegação inferior ---------- */

.nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
  display: grid; grid-template-columns: repeat(5, 1fr);
  background: var(--surface-1); border-top: 1px solid var(--border);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.nav button {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .15rem;
  min-height: var(--nav-h); border: 0; background: transparent;
  color: var(--text-3); font: inherit; font-size: .68rem; font-weight: 600; cursor: pointer;
  position: relative;
}
.nav button .ico { font-size: 1.3rem; line-height: 1; }
.nav button[aria-current="page"] { color: var(--brand); }
.nav .ponto {
  position: absolute; top: 10px; right: calc(50% - 20px);
  min-width: 17px; height: 17px; padding: 0 4px; border-radius: 999px;
  background: var(--grave); color: #fff; font-size: .62rem; font-weight: 700;
  display: grid; place-items: center;
}

/* ---------- modal ---------- */

.modal {
  position: fixed; inset: 0; z-index: 60;
  display: flex; align-items: flex-end; justify-content: center;
  background: rgba(0,0,0,.5);
  padding: 0;
}
@media (min-width: 560px) { .modal { align-items: center; padding: 1rem; } }

.modal__caixa {
  width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto;
  background: var(--surface-1);
  border-radius: var(--raio) var(--raio) 0 0;
  padding: 1.1rem 1rem calc(1.1rem + env(safe-area-inset-bottom, 0px));
  animation: sobe .18s ease-out;
}
@media (min-width: 560px) { .modal__caixa { border-radius: var(--raio); } }
@keyframes sobe { from { transform: translateY(14px); opacity: .6; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .modal__caixa { animation: none; } }

.modal__cab { display: flex; align-items: center; gap: .5rem; margin-bottom: .9rem; }
.modal__cab h2 { flex: 1; }
.fechar { width: 40px; height: 40px; border-radius: 50%; border: 0;
  background: var(--surface-2); color: var(--text-1); font-size: 1.2rem; cursor: pointer; }
.modal__rodape { display: flex; gap: .6rem; margin-top: 1.1rem; }
.modal__rodape .btn { flex: 1; }

/* ---------- baixa rápida ---------- */

.contador { display: flex; align-items: center; justify-content: center; gap: 1rem; margin: 1rem 0; }
.contador input { width: 110px; text-align: center; font-size: 1.6rem; font-weight: 700; min-height: 64px; }
.contador .redondo { width: 60px; height: 60px; flex-basis: 60px; font-size: 1.8rem; }

/* ---------- scanner ---------- */

#scanner-palco { position: relative; border-radius: var(--raio); overflow: hidden; background: #000; }
#scanner-video { display: block; width: 100%; max-height: 58vh; background: #000; object-fit: cover; }

/* Mira larga e baixa: mostra que o código deve preencher a largura. */
.mira-guia { position: absolute; inset: 0; pointer-events: none; }
.mira-guia span {
  position: absolute; width: 26px; height: 26px;
  border: 3px solid rgba(255,255,255,.9);
  filter: drop-shadow(0 0 2px rgba(0,0,0,.6));
}
.mira-guia span:nth-child(1) { left: 4%;  top: 32%;    border-right: 0; border-bottom: 0; border-radius: 6px 0 0 0; }
.mira-guia span:nth-child(2) { right: 4%; top: 32%;    border-left: 0;  border-bottom: 0; border-radius: 0 6px 0 0; }
.mira-guia span:nth-child(3) { left: 4%;  bottom: 32%; border-right: 0; border-top: 0;    border-radius: 0 0 0 6px; }
.mira-guia span:nth-child(4) { right: 4%; bottom: 32%; border-left: 0;  border-top: 0;    border-radius: 0 0 6px 0; }
#scanner-box   { width: 100%; border-radius: var(--raio); overflow: hidden; background: #000; }
#scanner-box video { width: 100% !important; }
.mira { text-align: center; font-size: .82rem; color: var(--text-2); margin-top: .6rem; }

/* ---------- aviso flutuante ---------- */

.toast {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(var(--nav-h) + 16px + env(safe-area-inset-bottom, 0px));
  z-index: 80; max-width: min(92vw, 460px);
  padding: .75rem 1rem; border-radius: var(--raio-sm);
  background: var(--text-1); color: var(--surface-1);
  font-size: .88rem; font-weight: 500; box-shadow: var(--sombra);
}
.toast--erro { background: var(--grave); color: #fff; }
.toast--ok   { background: var(--ok); color: #fff; }

/* ---------- login ---------- */

.login { min-height: 100dvh; display: grid; place-items: center; padding: 1.25rem; }
.login__caixa { width: 100%; max-width: 400px; }
.login__marca { text-align: center; margin-bottom: 1.5rem; }
.login__marca .ico { font-size: 3rem; display: block; }
.login__marca h1 { margin-top: .4rem; }
.login__marca p { color: var(--text-2); font-size: .9rem; margin-top: .25rem; }
.abas { display: grid; grid-template-columns: 1fr 1fr; gap: .4rem; margin-bottom: 1.1rem;
  background: var(--surface-2); padding: .25rem; border-radius: var(--raio-sm); }
.abas button { min-height: 42px; border: 0; border-radius: 8px; background: transparent;
  color: var(--text-2); font: inherit; font-weight: 600; cursor: pointer; }
.abas button[aria-selected="true"] { background: var(--surface-1); color: var(--text-1); box-shadow: var(--sombra); }
.erro-caixa { background: var(--grave-bg); color: var(--grave); border: 1px solid var(--grave);
  border-radius: var(--raio-sm); padding: .7rem .85rem; font-size: .85rem; margin-bottom: .9rem; }

/* ---------- tabela de dados (acessibilidade dos gráficos) ---------- */

.tabela-dados { width: 100%; border-collapse: collapse; font-size: .84rem; margin-top: .8rem; }
.tabela-dados th, .tabela-dados td { text-align: left; padding: .4rem .5rem; border-bottom: 1px solid var(--border); }
.tabela-dados th { color: var(--text-2); font-weight: 600; }
.tabela-dados td:last-child, .tabela-dados th:last-child { text-align: right; font-variant-numeric: tabular-nums; }
details.dados > summary { cursor: pointer; font-size: .8rem; color: var(--brand); font-weight: 600; margin-top: .6rem; }

.rolagem-x { overflow-x: auto; }

/* ===== Visão simples do estoque =====
   Uma linha por item, agrupado por local, seções que fecham.
   Feita para bater o olho: ponto colorido = situação, número à direita = quanto tem. */
.grupo { background: var(--surface-1); border: 1px solid var(--border);
  border-radius: var(--raio); margin-top: .55rem; overflow: hidden; }
.grupo summary { list-style: none; display: flex; align-items: center; gap: .5rem;

.grupo summary::-webkit-details-marker { display: none; }
.grupo summary::after { content: '▾'; margin-left: auto; color: var(--text-3);
  transition: transform .15s ease; }
.grupo:not([open]) summary::after { transform: rotate(-90deg); }
.grupo__n { font-size: .76rem; font-weight: 600; color: var(--text-2);
  background: var(--surface-2); padding: .12rem .55rem; border-radius: 999px; }
.lista-s { list-style: none; margin: 0; padding: 0 .5rem .4rem; }
.lista-s li { display: flex; align-items: center; gap: .55rem;
  padding: .52rem .35rem; cursor: pointer; }
.lista-s li + li { border-top: 1px solid var(--border); }
.item-s__nome { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis;
  white-space: nowrap; font-size: .92rem; }
.item-s__qtd { font-variant-numeric: tabular-nums; white-space: nowrap;
  font-size: .85rem; color: var(--text-2); }
.ponto { flex: 0 0 auto; width: 9px; height: 9px; border-radius: 50%;
  background: var(--ok); }
.ponto--baixo    { background: var(--alerta); }
.ponto--falta    { background: var(--grave); }
.ponto--vencendo { background: var(--aviso); }
.ponto--vencido  { background: var(--grave); }

  NOME_PADRAO_CASA: 'Minha casa',
  DIAS_ALERTA_VALIDADE: 7

<script defer>
/* ============================================================
   STORE — camada de dados
   ------------------------------------------------------------
   Expõe uma única API (Store.*) que funciona em dois modos:

   • local    → dados no navegador (localStorage), sem cadastro
   • supabase → login por e-mail/senha, dados na nuvem,
                várias pessoas na mesma casa

   O restante do app não sabe em qual modo está rodando.
   ============================================================ */

const Store = (() => {
  const CHAVE = 'estoque-casa:v1';
  let modo = 'local';
  let sb = null;          // cliente Supabase
  let usuario = null;     // { id, email, nome, papel }
  let casa = null;        // { id, nome }
  let cache = null;       // usado apenas no modo local
  let recuperandoSenha = false;   // veio do link "esqueci minha senha"

  /* ---------- utilidades ---------- */

  const uid = () =>
    (crypto.randomUUID ? crypto.randomUUID()
      : 'id-' + Date.now() + '-' + Math.random().toString(16).slice(2));

  const agora = () => new Date().toISOString();

  const vazio = () => ({
    casa: { id: 'local', nome: (window.APP_CONFIG?.NOME_PADRAO_CASA || 'Minha casa') },
    itens: [],
    movimentos: [],
    compras: [],
    config: {
      diasAlertaValidade: window.APP_CONFIG?.DIAS_ALERTA_VALIDADE ?? 7,
      tema: 'auto'
    }
  });

  function ler() {
    if (cache) return cache;
    try {
      const bruto = localStorage.getItem(CHAVE);
      cache = bruto ? JSON.parse(bruto) : vazio();
    } catch (e) {
      cache = vazio();
    }
    // garante campos novos em bases antigas
    const padrao = vazio();
    cache.config = Object.assign({}, padrao.config, cache.config || {});
    cache.itens ||= []; cache.movimentos ||= []; cache.compras ||= [];
    cache.casa ||= padrao.casa;
    return cache;
  }

  function gravar() {
    try {
      localStorage.setItem(CHAVE, JSON.stringify(cache));
    } catch (e) {
      console.warn('Não foi possível gravar no navegador:', e);
    }
  }

  const num = (v) => {
    const n = parseFloat(String(v ?? '').replace(',', '.'));
    return Number.isFinite(n) ? n : 0;
  };

  /* ---------- inicialização ---------- */

  async function init() {
    const cfg = window.APP_CONFIG || {};
    const temChaves = cfg.SUPABASE_URL && cfg.SUPABASE_ANON_KEY;
    const temLib = typeof window.supabase?.createClient === 'function';

    if (temChaves && temLib) {
      // Lido ANTES de criar o cliente: o supabase-js limpa a URL ao iniciar.
      // O link do e-mail de recuperação volta com "type=recovery".
      if (/type=recovery/.test(location.hash) || /type=recovery/.test(location.search)) {
        recuperandoSenha = true;
      }

      sb = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);
      modo = 'supabase';

      sb.auth.onAuthStateChange((evento) => {
        if (evento === 'PASSWORD_RECOVERY') recuperandoSenha = true;
      });

      const { data } = await sb.auth.getSession();
      if (data?.session && !recuperandoSenha) await carregarPerfil(data.session.user);
    } else {
      modo = 'local';
      const d = ler();
      casa = d.casa;
      usuario = { id: 'local', email: '', nome: 'Você', papel: 'admin' };
    }
    return modo;
  }

  async function carregarPerfil(authUser) {
    const { data: perfil, error } = await sb
      .from('profiles')
      .select('id, nome, papel, household_id, households(id, nome)')
      .eq('id', authUser.id)
      .maybeSingle();

    if (error || !perfil) { usuario = null; casa = null; return null; }

    usuario = {
      id: perfil.id,
      email: authUser.email,
      nome: perfil.nome || authUser.email,
      papel: perfil.papel || 'membro'
    };
    casa = perfil.households
      ? { id: perfil.households.id, nome: perfil.households.nome }
      : null;
    return usuario;
  }

  /* ---------- autenticação ---------- */

  async function entrar(email, senha) {
    if (modo === 'local') return usuario;
    const { data, error } = await sb.auth.signInWithPassword({ email, password: senha });
    if (error) throw new Error(traduzErro(error.message));
    return carregarPerfil(data.user);
  }

  async function cadastrar({ email, senha, nome, nomeCasa, codigoConvite }) {
    if (modo === 'local') return usuario;

    const { data, error } = await sb.auth.signUp({ email, password: senha });
    if (error) throw new Error(traduzErro(error.message));
    if (!data.user) throw new Error('Confirme o e-mail enviado e depois faça login.');

    // Sem sessão ativa (confirmação de e-mail ligada no projeto)
    if (!data.session) {
      return { precisaConfirmarEmail: true };
    }

    let casaId;
    if (codigoConvite) {
      // Função no banco: acha a casa pelo código sem expor a lista de casas.
      const { data: achada, error: e1 } = await sb
        .rpc('casa_por_convite', { codigo: codigoConvite.trim().toUpperCase() });
      if (e1 || !achada) throw new Error('Código de convite não encontrado.');
      casaId = achada;
    } else {
      const { data: nova, error: e2 } = await sb
        .from('households')
        .insert({ nome: nomeCasa || 'Minha casa' })
        .select('id').single();
      if (e2) throw new Error(e2.message);
      casaId = nova.id;
    }

    const { error: e3 } = await sb.from('profiles').insert({
      id: data.user.id,
      nome: nome || email,
      household_id: casaId,
      papel: codigoConvite ? 'membro' : 'admin'
    });
    if (e3) throw new Error(e3.message);

    return carregarPerfil(data.user);
  }

  async function sair() {
    if (modo === 'supabase') await sb.auth.signOut();
    usuario = null; casa = null;
  }

  /** Envia o e-mail com o link para criar uma senha nova. */
  async function pedirResetSenha(email) {
    if (modo === 'local') throw new Error('Disponível apenas no modo nuvem.');
    const destino = location.origin + location.pathname;
    const { error } = await sb.auth.resetPasswordForEmail(email.trim(), { redirectTo: destino });
    if (error) throw new Error(traduzErro(error.message));
  }

  /** Grava a nova senha (durante a recuperação ou já logado). */
  async function trocarSenha(nova) {
    if (modo === 'local') throw new Error('Disponível apenas no modo nuvem.');
    if (!nova || nova.length < 6) throw new Error('A senha precisa ter pelo menos 6 caracteres.');
    const { data, error } = await sb.auth.updateUser({ password: nova });
    if (error) throw new Error(traduzErro(error.message));
    recuperandoSenha = false;
    if (data?.user) await carregarPerfil(data.user);
    return usuario;
  }

  function traduzErro(msg) {
    const m = String(msg || '').toLowerCase();
    if (m.includes('invalid login'))       return 'E-mail ou senha incorretos.';
    if (m.includes('already registered'))  return 'Este e-mail já tem cadastro. Use "Entrar".';
    if (m.includes('email not confirmed')) return 'Confirme o e-mail que enviamos antes de entrar.';
    if (m.includes('rate limit') || m.includes('too many'))
      return 'Muitas tentativas seguidas. Espere um minuto e tente de novo.';
    if (m.includes('should be different')) return 'A nova senha precisa ser diferente da anterior.';
    if (m.includes('password'))            return 'A senha precisa ter pelo menos 6 caracteres.';
    if (m.includes('failed to fetch') || m.includes('network'))
      return 'Sem conexão com o servidor. Verifique a internet.';
    return msg;
  }

  /* ---------- itens ---------- */

  async function listarItens() {
    if (modo === 'local') return ler().itens.slice();
    const { data, error } = await sb.from('items')
      .select('*').eq('household_id', casa.id).order('nome');
    if (error) throw new Error(error.message);
    return data || [];
  }

  async function salvarItem(item) {
    const limpo = {
      nome: String(item.nome || '').trim(),
      categoria: item.categoria || 'Outros',
      ean: (item.ean || '').trim() || null,
      quantidade: num(item.quantidade),
      unidade: item.unidade || 'un',
      local: item.local || 'Despensa',
      minimo: num(item.minimo),
      validade: item.validade || null,
      observacoes: (item.observacoes || '').trim() || null
    };
    if (!limpo.nome) throw new Error('Informe o nome do item.');

    if (modo === 'local') {
      const d = ler();
      if (item.id) {
        const i = d.itens.findIndex((x) => x.id === item.id);
        if (i >= 0) d.itens[i] = Object.assign(d.itens[i], limpo, { atualizado_em: agora() });
        gravar();
        return d.itens[i];
      }
      const novo = Object.assign({ id: uid(), criado_em: agora(), atualizado_em: agora() }, limpo);
      d.itens.push(novo);
      gravar();
      return novo;
    }

    if (item.id) {
      const { data, error } = await sb.from('items')
        .update(limpo).eq('id', item.id).select().single();
      if (error) throw new Error(error.message);
      return data;
    }
    const { data, error } = await sb.from('items')
      .insert(Object.assign({ household_id: casa.id }, limpo)).select().single();
    if (error) throw new Error(error.message);
    return data;
  }

  async function excluirItem(id) {
    if (modo === 'local') {
      const d = ler();
      d.itens = d.itens.filter((x) => x.id !== id);
      d.movimentos = d.movimentos.filter((m) => m.item_id !== id);
      d.compras = d.compras.filter((c) => c.item_id !== id);
      gravar();
      return;
    }
    const { error } = await sb.from('items').delete().eq('id', id);
    if (error) throw new Error(error.message);
  }

  async function acharPorEan(ean) {
    if (!ean) return null;
    if (modo === 'local') return ler().itens.find((x) => x.ean === ean) || null;
    const { data } = await sb.from('items')
      .select('*').eq('household_id', casa.id).eq('ean', ean).maybeSingle();
    return data || null;
  }

  /* ---------- movimentações ---------- */

  async function movimentar({ item, tipo, quantidade, motivo }) {
    const qtd = num(quantidade);
    if (qtd <= 0) throw new Error('Informe uma quantidade maior que zero.');

    let nova;
    if (tipo === 'entrada')      nova = num(item.quantidade) + qtd;
    else if (tipo === 'saida')   nova = num(item.quantidade) - qtd;
    else                          nova = qtd; // ajuste: define o valor exato

    if (nova < 0) {
      throw new Error(
        `Não dá para retirar ${qtd}. Em estoque há apenas ${num(item.quantidade)} ${item.unidade}.`
      );
    }
    nova = Math.round(nova * 1000) / 1000;

    const registro = {
      item_id: item.id,
      item_nome: item.nome,
      tipo,
      quantidade: qtd,
      saldo: nova,
      motivo: (motivo || '').trim() || null,
      usuario_nome: usuario?.nome || 'Você',
      data: agora()
    };

    if (modo === 'local') {
      const d = ler();
      const alvo = d.itens.find((x) => x.id === item.id);
      if (!alvo) throw new Error('Item não encontrado.');
      alvo.quantidade = nova;
      alvo.atualizado_em = agora();
      d.movimentos.push(Object.assign({ id: uid() }, registro));
      gravar();
      await sincronizarListaCompras(alvo);
      return alvo;
    }

    const { error: e1 } = await sb.from('items')
      .update({ quantidade: nova }).eq('id', item.id);
    if (e1) throw new Error(e1.message);

    const { error: e2 } = await sb.from('movements').insert(
      Object.assign({ household_id: casa.id, usuario_id: usuario.id }, registro)
    );
    if (e2) throw new Error(e2.message);

    const atualizado = Object.assign({}, item, { quantidade: nova });
    await sincronizarListaCompras(atualizado);
    return atualizado;
  }

  async function listarMovimentos({ itemId = null, desde = null } = {}) {
    if (modo === 'local') {
      let lista = ler().movimentos.slice();
      if (itemId) lista = lista.filter((m) => m.item_id === itemId);
      if (desde)  lista = lista.filter((m) => m.data >= desde);
      return lista.sort((a, b) => (a.data < b.data ? 1 : -1));
    }
    let q = sb.from('movements').select('*')
      .eq('household_id', casa.id).order('data', { ascending: false }).limit(1000);
    if (itemId) q = q.eq('item_id', itemId);
    if (desde)  q = q.gte('data', desde);
    const { data, error } = await q;
    if (error) throw new Error(error.message);
    return data || [];
  }

  /* ---------- lista de compras ---------- */

  async function listarCompras() {
    if (modo === 'local') {
      return ler().compras.filter((c) => !c.comprado);
    }
    const { data, error } = await sb.from('shopping_list')
      .select('*').eq('household_id', casa.id).eq('comprado', false)
      .order('criado_em');
    if (error) throw new Error(error.message);
    return data || [];
  }

  /** Entra/sai da lista automaticamente conforme a quantidade mínima. */
  async function sincronizarListaCompras(item) {
    const precisa = num(item.quantidade) <= num(item.minimo);

    if (modo === 'local') {
      const d = ler();
      const existe = d.compras.find((c) => c.item_id === item.id && !c.comprado);
      if (precisa && !existe) {
        d.compras.push({
          id: uid(), item_id: item.id, nome: item.nome,
          quantidade: null, unidade: item.unidade,
          manual: false, comprado: false, criado_em: agora()
        });
      } else if (!precisa && existe && !existe.manual) {
        d.compras = d.compras.filter((c) => c.id !== existe.id);
      }
      gravar();
      return;
    }

    const { data: existe } = await sb.from('shopping_list')
      .select('id, manual').eq('household_id', casa.id)
      .eq('item_id', item.id).eq('comprado', false).maybeSingle();

    if (precisa && !existe) {
      await sb.from('shopping_list').insert({
        household_id: casa.id, item_id: item.id, nome: item.nome,
        unidade: item.unidade, manual: false, comprado: false
      });
    } else if (!precisa && existe && !existe.manual) {
      await sb.from('shopping_list').delete().eq('id', existe.id);
    }
  }

  /** Reavalia todos os itens (usado ao abrir a lista de compras). */
  async function reavaliarListaCompras() {
    const itens = await listarItens();
    for (const it of itens) await sincronizarListaCompras(it);
  }

  async function adicionarCompraManual(nome, quantidade, unidade) {
    const limpo = String(nome || '').trim();
    if (!limpo) throw new Error('Informe o nome do produto.');
    if (modo === 'local') {
      const d = ler();
      d.compras.push({
        id: uid(), item_id: null, nome: limpo,
        quantidade: quantidade ? num(quantidade) : null,
        unidade: unidade || 'un',
        manual: true, comprado: false, criado_em: agora()
      });
      gravar();
      return;
    }
    const { error } = await sb.from('shopping_list').insert({
      household_id: casa.id, item_id: null, nome: limpo,
      quantidade: quantidade ? num(quantidade) : null,
      unidade: unidade || 'un', manual: true, comprado: false
    });
    if (error) throw new Error(error.message);
  }

  async function removerCompra(id) {
    if (modo === 'local') {
      const d = ler();
      d.compras = d.compras.filter((c) => c.id !== id);
      gravar();
      return;
    }
    const { error } = await sb.from('shopping_list').delete().eq('id', id);
    if (error) throw new Error(error.message);
  }

  /* ---------- configurações e casa ---------- */

  async function lerConfig() {
    if (modo === 'local') return ler().config;
    const salvo = localStorage.getItem(CHAVE + ':config');
    return Object.assign(
      { diasAlertaValidade: window.APP_CONFIG?.DIAS_ALERTA_VALIDADE ?? 7, tema: 'auto' },
      salvo ? JSON.parse(salvo) : {}
    );
  }

  async function salvarConfig(parcial) {
    if (modo === 'local') {
      const d = ler();
      d.config = Object.assign(d.config, parcial);
      gravar();
      return d.config;
    }
    const atual = await lerConfig();
    const novo = Object.assign(atual, parcial);
    localStorage.setItem(CHAVE + ':config', JSON.stringify(novo));
    return novo;
  }

  async function renomearCasa(nome) {
    if (modo === 'local') {
      const d = ler();
      d.casa.nome = nome; casa = d.casa; gravar();
      return;
    }
    const { error } = await sb.from('households').update({ nome }).eq('id', casa.id);
    if (error) throw new Error(error.message);
    casa.nome = nome;
  }

  async function codigoConvite() {
    if (modo === 'local') return null;
    const { data } = await sb.from('households')
      .select('codigo_convite').eq('id', casa.id).maybeSingle();
    return data?.codigo_convite || null;
  }

  async function listarMembros() {
    if (modo === 'local') return [{ id: 'local', nome: 'Você', papel: 'admin' }];
    const { data } = await sb.from('profiles')
      .select('id, nome, papel').eq('household_id', casa.id).order('nome');
    return data || [];
  }

  /* ---------- IA: reconhecer produto pela foto ---------- */

  /** A IA só funciona no modo nuvem: a chave dela fica no Supabase. */
  function iaDisponivel() {
    return modo === 'supabase' && !!usuario;
  }

  /**
   * Manda a foto para a função no Supabase e recebe os dados do produto.
   * A imagem vai em base64, sem o prefixo "data:...".
   */
  async function reconhecerProduto(base64, tipo) {
    if (!iaDisponivel()) {
      throw new Error('O reconhecimento por foto precisa do modo nuvem ligado e de você logado.');
    }

    const { data: sessao } = await sb.auth.getSession();
    const token = sessao?.session?.access_token;
    if (!token) throw new Error('Sua sessão expirou. Entre de novo.');

    const cfg = window.APP_CONFIG || {};
    const url = cfg.SUPABASE_URL.replace(/\/$/, '') + '/functions/v1/reconhecer-produto';

    let resp;
    try {
      const ctrl = new AbortController();
      const t = setTimeout(() => ctrl.abort(), 45000);
      resp = await fetch(url, {
        method: 'POST',
        signal: ctrl.signal,
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + token,
          'apikey': cfg.SUPABASE_ANON_KEY
        },
        body: JSON.stringify({ imagem: base64, tipo })
      });
      clearTimeout(t);
    } catch (e) {
      if (e.name === 'AbortError') throw new Error('A IA demorou demais para responder. Tente de novo.');
      throw new Error('Sem conexão com o servidor da IA.');
    }

    if (resp.status === 404) {
      throw new Error('A função "reconhecer-produto" ainda não foi criada no Supabase. Veja o guia da IA.');
    }
    if (resp.status === 401 || resp.status === 403) {
      throw new Error('O Supabase recusou o acesso. Saia e entre de novo no app.');
    }

    let dados;
    try { dados = await resp.json(); }
    catch (e) { throw new Error('Resposta inesperada do servidor da IA.'); }

    if (!resp.ok) throw new Error(dados?.erro || 'A IA não conseguiu responder agora.');
    if (!dados?.encontrou) throw new Error(dados?.erro || 'Não reconheci um produto nessa foto.');

    return dados;
  }

  /* ---------- migração do estoque local para a nuvem ---------- */

  /** Quantos itens existem guardados neste aparelho (modo local). */
  function contarItensLocais() {
    try {
      const bruto = localStorage.getItem(CHAVE);
      if (!bruto) return 0;
      const d = JSON.parse(bruto);
      return Array.isArray(d.itens) ? d.itens.length : 0;
    } catch (e) { return 0; }
  }

  /** Sobe para a casa na nuvem os itens e o histórico guardados no aparelho. */
  async function importarLocalParaNuvem() {
    if (modo !== 'supabase') throw new Error('Disponível apenas no modo nuvem.');

    let local;
    try { local = JSON.parse(localStorage.getItem(CHAVE) || 'null'); }
    catch (e) { local = null; }
    if (!local || !Array.isArray(local.itens) || !local.itens.length) return { itens: 0, movimentos: 0 };

    const jaExistem = await listarItens();
    const porNome = new Map(jaExistem.map((i) => [String(i.nome).trim().toLowerCase(), i.id]));
    const mapaIds = {};   // id local -> id na nuvem
    let novos = 0;

    for (const it of local.itens) {
      const chaveNome = String(it.nome || '').trim().toLowerCase();
      if (!chaveNome) continue;

      if (porNome.has(chaveNome)) { mapaIds[it.id] = porNome.get(chaveNome); continue; }

      const { data, error } = await sb.from('items').insert({
        household_id: casa.id,
        nome: it.nome,
        categoria: it.categoria || 'Outros',
        ean: it.ean || null,
        quantidade: num(it.quantidade),
        unidade: it.unidade || 'un',
        local: it.local || 'Despensa',
        minimo: num(it.minimo),
        validade: it.validade || null,
        observacoes: it.observacoes || null
      }).select('id').single();

      if (error) continue;
      mapaIds[it.id] = data.id;
      porNome.set(chaveNome, data.id);
      novos++;
    }

    const movs = (local.movimentos || [])
      .filter((m) => mapaIds[m.item_id])
      .map((m) => ({
        household_id: casa.id,
        item_id: mapaIds[m.item_id],
        item_nome: m.item_nome || '',
        tipo: m.tipo,
        quantidade: num(m.quantidade),
        saldo: m.saldo ?? null,
        motivo: m.motivo || null,
        usuario_id: usuario.id,
        usuario_nome: m.usuario_nome || usuario.nome,
        data: m.data
      }))
      .filter((m) => m.quantidade > 0);

    for (let i = 0; i < movs.length; i += 200) {
      await sb.from('movements').insert(movs.slice(i, i + 200));
    }

    await reavaliarListaCompras();
    localStorage.setItem(CHAVE + ':importado', new Date().toISOString());
    return { itens: novos, movimentos: movs.length };
  }

  function jaImportou() {
    return !!localStorage.getItem(CHAVE + ':importado');
  }

  function marcarImportacaoDispensada() {
    localStorage.setItem(CHAVE + ':importado', 'dispensado');
  }

  /* ---------- exportar / apagar tudo ---------- */

  function exportarBackup() {
    return modo === 'local' ? JSON.stringify(ler(), null, 2) : null;
  }

  function apagarTudoLocal() {
    localStorage.removeItem(CHAVE);
    cache = null;
  }

  /* ---------- API pública ---------- */

  return {
    init,
    get modo()    { return modo; },
    get usuario() { return usuario; },
    get casa()    { return casa; },
    entrar, cadastrar, sair, pedirResetSenha, trocarSenha,
    get recuperandoSenha() { return recuperandoSenha; },
    contarItensLocais, importarLocalParaNuvem, jaImportou, marcarImportacaoDispensada,
    iaDisponivel, reconhecerProduto,
    listarItens, salvarItem, excluirItem, acharPorEan,
    movimentar, listarMovimentos,
    listarCompras, adicionarCompraManual, removerCompra,
    sincronizarListaCompras, reavaliarListaCompras,
    lerConfig, salvarConfig, renomearCasa, codigoConvite, listarMembros,
    exportarBackup, apagarTudoLocal,
    num
  };
})();

</script>

<script defer>
/* ============================================================
   SCANNER — leitura de código de barras
   ------------------------------------------------------------
   Três caminhos, do mais rápido ao mais teimoso:

   1. BarcodeDetector — leitor do próprio sistema (Chrome/Android).
   2. zbar (WebAssembly) — decodifica o quadro da câmera em
      RESOLUÇÃO NATIVA, num laço contínuo. É o caminho do iPhone,
      que não tem BarcodeDetector.
   3. Foto pelo app de câmera do celular — o usuário tira uma foto
      normal (com autofoco de verdade, 12 megapixels) e o app lê
      a imagem. Salva os casos difíceis: embalagem amassada,
      código pequeno, pouca luz.

   Por que não usar o leitor "pronto" das bibliotecas: html5-qrcode
   e o BrowserMultiFormatReader do ZXing redesenham o vídeo no
   tamanho em que ele aparece na tela (~330 px num celular) antes
   de decodificar. Um EAN-13 tem 95 barras: sobra ~2 px por barra
   e a leitura falha. Aqui o quadro é copiado no tamanho real e
   apenas recortado — nunca reduzido.
   ============================================================ */

const Scanner = (() => {
  let stream = null;
  let rodando = false;
  let rafId = null;
  let timer = null;

  const FORMATOS_NATIVOS = ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128', 'code_39', 'itf', 'qr_code'];

  const suporteNativo = () => 'BarcodeDetector' in window;
  const suporteZbar   = () => typeof window.zbarWasm?.scanImageData === 'function';

  /* ---------- abertura da câmera ---------- */

  async function iniciar({ video, onLeitura, onErro }) {
    parar();
    rodando = true;

    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: { ideal: 'environment' },
          // Resolução alta é o que torna a leitura possível.
          width:  { ideal: 1920 },
          height: { ideal: 1080 }
        },
        audio: false
      });
    } catch (e) {
      rodando = false;
      onErro?.(mensagemErro(e));
      return null;
    }

    const palco = document.getElementById('scanner-palco');
    if (palco) palco.hidden = false; else video.hidden = false;

    video.srcObject = stream;
    video.setAttribute('playsinline', '');
    video.muted = true;

    try { await video.play(); } catch (e) { /* iOS às vezes recusa a 1ª vez */ }

    const limite = Date.now() + 5000;
    while (rodando && !video.videoWidth && Date.now() < limite) {
      await new Promise((r) => setTimeout(r, 80));
    }
    if (!rodando) return null;

    if (suporteNativo()) {
      try { await lacoNativo({ video, onLeitura }); return 'nativo'; }
      catch (e) { console.warn('BarcodeDetector falhou, usando zbar:', e); }
    }

    if (suporteZbar()) { lacoZbar({ video, onLeitura }); return 'zbar'; }

    rodando = false;
    onErro?.('Leitor indisponível. Tire uma foto do código ou digite o número.');
    return null;
  }

  /* ---------- caminho 1: leitor do sistema ---------- */

  async function lacoNativo({ video, onLeitura }) {
    let suportados = [];
    try { suportados = await window.BarcodeDetector.getSupportedFormats(); } catch (e) {}
    const formats = FORMATOS_NATIVOS.filter((f) => !suportados.length || suportados.includes(f));
    const detector = new window.BarcodeDetector(formats.length ? { formats } : undefined);

    const passo = async () => {
      if (!rodando) return;
      try {
        if (video.readyState >= 2) {
          const achados = await detector.detect(video);
          const codigo = achados && achados.length ? String(achados[0].rawValue || '').trim() : '';
          if (codigo) { onLeitura(codigo); return; }
        }
      } catch (e) { /* quadro ruim: segue */ }
      rafId = requestAnimationFrame(passo);
    };
    rafId = requestAnimationFrame(passo);
  }

  /* ---------- caminho 2: zbar em resolução nativa ---------- */

  function lacoZbar({ video, onLeitura }) {
    const tela = document.createElement('canvas');
    const pincel = tela.getContext('2d', { willReadFrequently: true });
    let ocupado = false;

    const tentar = async () => {
      if (!rodando || ocupado) { if (rodando) timer = setTimeout(tentar, 60); return; }
      ocupado = true;
      try {
        const vw = video.videoWidth, vh = video.videoHeight;
        if (vw && vh) {
          // Recorta uma faixa central em tamanho REAL. Recortar mantém a
          // nitidez; reduzir destruiria as barras finas.
          const faixa = Math.round(vh * 0.6);
          const topo = Math.round((vh - faixa) / 2);
          if (tela.width !== vw || tela.height !== faixa) { tela.width = vw; tela.height = faixa; }
          pincel.drawImage(video, 0, topo, vw, faixa, 0, 0, vw, faixa);

          const simbolos = await window.zbarWasm.scanImageData(
            pincel.getImageData(0, 0, tela.width, tela.height)
          );
          const codigo = simbolos?.length ? String(simbolos[0].decode() || '').trim() : '';
          if (codigo && rodando) { onLeitura(codigo); return; }
        }
      } catch (e) { /* quadro ruim: segue */ }
      finally { ocupado = false; }

      if (rodando) timer = setTimeout(tentar, 60);
    };
    tentar();
  }

  /* ---------- caminho 3: foto tirada pelo app de câmera ---------- */

  /** Lê um código de barras de um arquivo de imagem (foto do celular). */
  async function lerDaImagem(arquivo) {
    const bitmap = await carregarImagem(arquivo);

    // Foto de celular tem 12 MP: reduzir um pouco acelera muito e ainda
    // sobra resolução de sobra para as barras.
    const maior = Math.max(bitmap.width, bitmap.height);
    const escala = maior > 2600 ? 2600 / maior : 1;
    const w = Math.round(bitmap.width * escala);
    const h = Math.round(bitmap.height * escala);

    const tela = document.createElement('canvas');
    const pincel = tela.getContext('2d', { willReadFrequently: true });

    // Tenta a imagem inteira e, depois, recortes: código costuma estar
    // no centro, e recortar aumenta o peso relativo das barras.
    const recortes = [
      [0, 0, 1, 1],
      [0, 0.25, 1, 0.5],
      [0.15, 0.15, 0.7, 0.7],
      [0, 0, 1, 0.5],
      [0, 0.5, 1, 0.5]
    ];

    for (const [fx, fy, fw, fh] of recortes) {
      tela.width  = Math.max(2, Math.round(w * fw));
      tela.height = Math.max(2, Math.round(h * fh));
      pincel.drawImage(
        bitmap,
        bitmap.width * fx, bitmap.height * fy, bitmap.width * fw, bitmap.height * fh,
        0, 0, tela.width, tela.height
      );
      try {
        const simbolos = await window.zbarWasm.scanImageData(
          pincel.getImageData(0, 0, tela.width, tela.height)
        );
        if (simbolos?.length) {
          const codigo = String(simbolos[0].decode() || '').trim();
          if (codigo) { fecharBitmap(bitmap); return codigo; }
        }
      } catch (e) { /* tenta o próximo recorte */ }
    }

    fecharBitmap(bitmap);
    return null;
  }

  function carregarImagem(arquivo) {
    if (typeof createImageBitmap === 'function') {
      return createImageBitmap(arquivo);
    }
    return new Promise((ok, falha) => {
      const url = URL.createObjectURL(arquivo);
      const img = new Image();
      img.onload = () => { URL.revokeObjectURL(url); ok(img); };
      img.onerror = () => { URL.revokeObjectURL(url); falha(new Error('imagem inválida')); };
      img.src = url;
    });
  }

  function fecharBitmap(b) { try { b.close?.(); } catch (e) {} }

  /**
   * Prepara a foto para mandar à IA: reduz e converte para base64.
   * Reduzir importa — foto de 12 MP deixaria a resposta lenta e cara
   * sem melhorar em nada o reconhecimento.
   */
  async function prepararParaIA(arquivo, ladoMaximo = 1100) {
    const bitmap = await carregarImagem(arquivo);
    const maior = Math.max(bitmap.width, bitmap.height);
    const escala = maior > ladoMaximo ? ladoMaximo / maior : 1;

    const tela = document.createElement('canvas');
    tela.width  = Math.round(bitmap.width * escala);
    tela.height = Math.round(bitmap.height * escala);
    tela.getContext('2d').drawImage(bitmap, 0, 0, tela.width, tela.height);
    fecharBitmap(bitmap);

    const dataUrl = tela.toDataURL('image/jpeg', 0.82);
    return { base64: dataUrl.split(',')[1], tipo: 'image/jpeg' };
  }

  /* ---------- erros e parada ---------- */

  function mensagemErro(e) {
    const nome = e?.name || '';
    if (nome === 'NotAllowedError')  return 'Permissão de câmera negada. Libere o acesso nas configurações do navegador.';
    if (nome === 'NotFoundError')    return 'Nenhuma câmera encontrada neste aparelho.';
    if (nome === 'NotReadableError') return 'A câmera está sendo usada por outro aplicativo.';
    if (location.protocol !== 'https:' && location.hostname !== 'localhost') {
      return 'A câmera só funciona em endereços https. Digite o código manualmente.';
    }
    return 'Não foi possível abrir a câmera. Tire uma foto do código ou digite o número.';
  }

  function parar() {
    rodando = false;
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
    if (timer) { clearTimeout(timer); timer = null; }
    if (stream) { stream.getTracks().forEach((t) => t.stop()); stream = null; }
    const palco = document.getElementById('scanner-palco');
    if (palco) palco.hidden = true;
  }

  /* ---------- Open Food Facts ---------- */

  async function consultarOpenFoodFacts(ean) {
    try {
      const url = `https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(ean)}` +
                  `?fields=product_name,product_name_pt,brands,quantity,categories_tags`;
      const ctrl = new AbortController();
      const t = setTimeout(() => ctrl.abort(), 6000);
      const resp = await fetch(url, { signal: ctrl.signal, headers: { Accept: 'application/json' } });
      clearTimeout(t);
      if (!resp.ok) return null;

      const json = await resp.json();
      if (json.status !== 1 || !json.product) return null;

      const p = json.product;
      const nome = (p.product_name_pt || p.product_name || '').trim();
      const marca = (p.brands || '').split(',')[0].trim();
      if (!nome && !marca) return null;

      const nomeFinal = juntarNomeMarca(nome, marca);
      return {
        nome: nomeFinal,
        quantidadeTexto: (p.quantity || '').trim(),
        categoria: adivinharCategoria(p.categories_tags || [], nomeFinal)
      };
    } catch (e) { return null; }
  }

  const semAcento = (s) => String(s || '').normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '').toLowerCase();

  /* Só acrescenta a marca quando ela ainda não aparece no nome do produto —
     senão sai "Manteiga Itambé 500g — Itambé". */
  function juntarNomeMarca(nome, marca) {
    if (!marca) return nome.slice(0, 80);
    if (!nome)  return marca.slice(0, 80);
    const chave = (s) => semAcento(s).replace(/[^a-z0-9]+/g, '');
    if (chave(nome).includes(chave(marca))) return nome.slice(0, 80);
    return `${nome} ${marca}`.slice(0, 80);
  }

  /* Adivinha a categoria pelas tags do Open Food Facts e, quando elas faltam
     (comum em produto brasileiro), pelo próprio nome. */
  function adivinharCategoria(tags, nome) {
    /* As tags vêm como "en:beverages", "pt:cereais": tira o prefixo de idioma e
       troca hífen por espaço para dar para casar palavra inteira.

       ARMADILHA: "en:plant-based-foods-and-beverages" é o guarda-chuva de quase
       todo alimento vegetal — arroz, aveia, azeite, farinha, macarrão, óleo.
       Casar "beverage" solto dentro dele jogava metade da despensa em Bebidas. */
    const t = ' ' + (tags || [])
      .map((x) => String(x).replace(/^[a-z]{2,3}:/, '').replace(/-/g, ' ').toLowerCase())
      .filter((x) => x !== 'plant based foods and beverages')
      .join(' | ') + ' ';
    const n = ' ' + semAcento(nome).replace(/[^a-z0-9]+/g, ' ').trim() + ' ';

    const REGRAS = [
      ['Outros',  /\b(matches|batteries|light bulbs|aluminium foil)/,
                  /\b(fosforo|vela|pilha|bateria|lampada|filtro de cafe|acendedor|carvao|guardanapo|papel aluminio|filme plastico|isqueiro)\b/],
      ['Limpeza', /\b(detergent|laundry|bleach|dishwashing|cleaning)/,
                  /\b(detergente|sabao|lava roupas|lava loucas|amaciante|desinfetante|agua sanitaria|alvejante|limpa|multiuso|desengordurante|esponja|saco de lixo|papel toalha|cloro|alcool)\b/],
      ['Higiene', /\b(hygiene|soap|shampoo|toothpaste|cosmetic|deodorant|beauty|toilet paper)/,
                  /\b(sabonete|shampoo|xampu|condicionador|creme dental|pasta de dente|desodorante|papel higienico|absorvente|fralda|escova de dente|hidratante|barbear)\b/],
      ['Pet',     /\b(pet food|dog|cat food|animal feed)/,
                  /\b(racao|petisco|areia sanitaria)\b/],
      ['Bebidas', /\b(beverages|drinks|waters|juices|sodas|coffees|teas|beers|wines|spirits|alcoholic)/,
                  /\b(refrigerante|suco|nectar|agua mineral|cerveja|vinho|cachaca|whisky|vodka|energetico|isotonico|cha|cafe|xarope|achocolatado)\b/]
    ];

    for (const [cat, reTag, reNome] of REGRAS) {
      if (reTag.test(t) || reNome.test(n)) return cat;
    }
    /* Sem pista nenhuma: produto com código de barras quase sempre é comida —
       chutar "Alimentos" erra bem menos que "Outros". */
    return 'Alimentos';
  }

  return { iniciar, parar, suporteNativo, lerDaImagem, prepararParaIA, consultarOpenFoodFacts };
})();

</script>

<script defer>
/* ============================================================
   APP — telas e interações
   ============================================================ */

const App = (() => {

  const CATEGORIAS = ['Alimentos', 'Bebidas', 'Limpeza', 'Higiene', 'Pet', 'Outros'];
  const LOCAIS     = ['Despensa', 'Geladeira', 'Freezer', 'Armário', 'Lavanderia', 'Banheiro', 'Outro'];
  const UNIDADES   = ['un', 'kg', 'g', 'L', 'mL', 'pacote', 'caixa', 'rolo'];

  const CORES_SERIE = ['--series-1','--series-2','--series-3','--series-4','--series-5','--series-6'];

  let tela = 'inicio';
  let itens = [];
  let config = { diasAlertaValidade: 7, tema: 'auto' };
  let filtro = { texto: '', categoria: '', local: '', situacao: '' };
  /* Visão da lista do estoque: 'detalhada' (cartões com botões) ou
     'simples' (uma linha por item, agrupado por local). Fica guardada
     no aparelho para a tela abrir do jeito que a pessoa deixou. */
  let visaoEstoque = 'detalhada';
  try { visaoEstoque = localStorage.getItem('estoque-casa:v1:visao') || 'detalhada'; } catch (e) {}
  let graficos = [];

  /* ---------------- utilidades ---------------- */

  const $  = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));

  function esc(v) {
    return String(v ?? '').replace(/[&<>"']/g, (c) =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  const nf = new Intl.NumberFormat('pt-BR', { maximumFractionDigits: 3 });
  const qtd = (n) => nf.format(Number(n) || 0);

  function dataBR(iso) {
    if (!iso) return '';
    const d = new Date(iso.length === 10 ? iso + 'T12:00:00' : iso);
    if (isNaN(d)) return '';
    return d.toLocaleDateString('pt-BR');
  }

  function dataHoraBR(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    if (isNaN(d)) return '';
    return d.toLocaleDateString('pt-BR') + ' ' +
           d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  }

  function hojeISO() {
    const d = new Date();
    return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
  }

  function diasAte(validade) {
    if (!validade) return null;
    const alvo = new Date(validade + 'T12:00:00');
    if (isNaN(alvo)) return null;
    const hoje = new Date(hojeISO() + 'T12:00:00');
    return Math.round((alvo - hoje) / 86400000);
  }

  /** Situação do item: falta > vencido > baixo > vencendo > ok */
  function situacao(item) {
    const q = Store.num(item.quantidade);
    const m = Store.num(item.minimo);
    const d = diasAte(item.validade);
    if (q <= 0) return 'falta';
    if (d !== null && d < 0) return 'vencido';
    if (m > 0 && q <= m) return 'baixo';
    if (d !== null && d <= (config.diasAlertaValidade ?? 7)) return 'vencendo';
    return 'ok';
  }

  const ROTULO_SIT = {
    falta: 'Em falta', vencido: 'Vencido', baixo: 'Acabando',
    vencendo: 'Vence logo', ok: 'Ok'
  };

  function toast(msg, tipo = '') {
    $$('.toast').forEach((t) => t.remove());
    const t = document.createElement('div');
    t.className = 'toast' + (tipo ? ' toast--' + tipo : '');
    t.setAttribute('role', 'status');
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 3200);
  }

  /* ---------------- modal ---------------- */

  function abrirModal(titulo, corpoHTML, aoMontar) {
    fecharModal();
    const wrap = document.createElement('div');
    wrap.className = 'modal';
    wrap.setAttribute('role', 'dialog');
    wrap.setAttribute('aria-modal', 'true');
    wrap.innerHTML = `
      <div class="modal__caixa">
        <div class="modal__cab">
          <h2>${esc(titulo)}</h2>
          <button type="button" class="fechar" data-fechar aria-label="Fechar">✕</button>
        </div>
        <div class="modal__corpo">${corpoHTML}</div>
      </div>`;
    $('#modais').appendChild(wrap);

    wrap.addEventListener('click', (e) => {
      if (e.target === wrap || e.target.closest('[data-fechar]')) fecharModal();
    });
    document.addEventListener('keydown', escFecha);
    aoMontar?.(wrap);
    const primeiro = wrap.querySelector('input:not([type=hidden]), select, textarea, button:not([data-fechar])');
    primeiro?.focus();
    return wrap;
  }

  function escFecha(e) { if (e.key === 'Escape') fecharModal(); }

  function fecharModal() {
    Scanner.parar();
    document.removeEventListener('keydown', escFecha);
    $('#modais').innerHTML = '';
  }

  function confirmar(titulo, texto, aoConfirmar, rotulo = 'Confirmar') {
    abrirModal(titulo, `
      <p>${esc(texto)}</p>
      <div class="modal__rodape">
        <button type="button" class="btn" data-fechar>Cancelar</button>
        <button type="button" class="btn btn--primario" id="ok-conf">${esc(rotulo)}</button>
      </div>`, (w) => {
      w.querySelector('#ok-conf').onclick = async () => { fecharModal(); await aoConfirmar(); };
    });
  }

  /* ---------------- carregamento ---------------- */

  async function recarregar() {
    itens = await Store.listarItens();
    itens.sort((a, b) => String(a.nome).localeCompare(String(b.nome), 'pt-BR'));
    await atualizarPontoCompras();
  }

  async function atualizarPontoCompras() {
    try {
      const lista = await Store.listarCompras();
      const p = $('#ponto-compras');
      if (!p) return;
      p.hidden = lista.length === 0;
      p.textContent = lista.length > 99 ? '99+' : lista.length;
    } catch (e) { /* silencioso */ }
  }

  /* ---------------- navegação ---------------- */

  async function irPara(nova, opcoes = {}) {
    tela = nova;
    $$('.nav button').forEach((b) =>
      b.setAttribute('aria-current', b.dataset.tela === nova ? 'page' : 'false'));
    window.scrollTo({ top: 0 });
    destruirGraficos();
    await render(opcoes);
  }

  function destruirGraficos() {
    graficos.forEach((g) => { try { g.destroy(); } catch (e) {} });
    graficos = [];
  }

  async function render(opcoes = {}) {
    const alvo = $('#conteudo');
    if (tela === 'inicio')   return telaInicio(alvo);
    if (tela === 'estoque')  return telaEstoque(alvo, opcoes);
    if (tela === 'escanear') return telaEscanear(alvo);
    if (tela === 'compras')  return telaCompras(alvo);
    if (tela === 'mais')     return telaMais(alvo);
  }

  /* ================= TELA: INÍCIO ================= */

  async function telaInicio(alvo) {
    await recarregar();

    const cont = { falta: 0, baixo: 0, vencendo: 0, vencido: 0, ok: 0 };
    itens.forEach((i) => cont[situacao(i)]++);
    const precisaComprar = cont.falta + cont.baixo;
    const atencaoValidade = cont.vencendo + cont.vencido;

    const movs = (await Store.listarMovimentos()).slice(0, 6);

    const alertas = itens
      .map((i) => ({ i, s: situacao(i) }))
      .filter((x) => x.s !== 'ok')
      .sort((a, b) => {
        const ordem = { falta: 0, vencido: 1, baixo: 2, vencendo: 3 };
        return ordem[a.s] - ordem[b.s];
      })
      .slice(0, 6);

    alvo.innerHTML = `
      <div class="acoes-rapidas">
        <button type="button" class="acao-grande acao-grande--destaque" data-ir="escanear">
          <span class="ico" aria-hidden="true">📷</span>Escanear
          <small>Ler código de barras</small>
        </button>
        <button type="button" class="acao-grande" data-baixa-rapida>
          <span class="ico" aria-hidden="true">📤</span>Dar baixa
          <small>Consumi um item</small>
        </button>
      </div>

      <div class="kpis">
        <button type="button" class="kpi" data-filtro="">
          <div class="kpi__valor">${itens.length}</div>
          <div class="kpi__rotulo">Itens cadastrados</div>
        </button>
        <button type="button" class="kpi ${precisaComprar ? 'kpi--alerta' : 'kpi--ok'}" data-filtro="baixo">
          <div class="kpi__valor">${precisaComprar}</div>
          <div class="kpi__rotulo">Acabando ou em falta</div>
        </button>
        <button type="button" class="kpi ${atencaoValidade ? 'kpi--aviso' : 'kpi--ok'}" data-filtro="vencendo">
          <div class="kpi__valor">${atencaoValidade}</div>
          <div class="kpi__rotulo">Validade próxima</div>
        </button>
        <button type="button" class="kpi" data-ir="compras">
          <div class="kpi__valor" id="kpi-compras">–</div>
          <div class="kpi__rotulo">Na lista de compras</div>
        </button>
      </div>

      ${alertas.length ? `
      <section class="cartao">
        <div class="cartao__cab">
          <h2>Precisa de atenção</h2>
          <button type="button" class="btn btn--fantasma btn--pequeno" data-filtro="baixo">Ver tudo</button>
        </div>
        <ul class="lista">
          ${alertas.map((x) => linhaItem(x.i)).join('')}
        </ul>
      </section>` : `
      <section class="cartao">
        <div class="vazio" style="padding:1.4rem">
          <span class="ico" aria-hidden="true">${itens.length ? '✅' : '📦'}</span>
          <h3>${itens.length ? 'Tudo em ordem' : 'Comece cadastrando um item'}</h3>
          <p>${itens.length
              ? 'Nenhum item abaixo do mínimo ou perto do vencimento.'
              : 'Use o botão Escanear ou cadastre manualmente pela aba Estoque.'}</p>
          ${itens.length ? '' : '<button type="button" class="btn btn--primario" data-novo-item>Cadastrar item</button>'}
        </div>
      </section>`}

      <section class="cartao">
        <div class="cartao__cab"><h2>Últimas movimentações</h2></div>
        ${movs.length ? movs.map(linhaMov).join('') :
          '<p style="color:var(--text-2);font-size:.88rem;margin:0">Nenhuma movimentação registrada ainda.</p>'}
      </section>`;

    Store.listarCompras().then((l) => {
      const k = $('#kpi-compras'); if (k) k.textContent = l.length;
    });
  }

  function linhaMov(m) {
    const sinal = m.tipo === 'entrada' ? '+' : m.tipo === 'saida' ? '−' : '=';
    return `
      <div class="mov">
        <span class="mov__qtd mov__qtd--${esc(m.tipo)}">${sinal}${qtd(m.quantidade)}</span>
        <span class="mov__nome">${esc(m.item_nome || 'Item')}</span>
        <span class="mov__data">${esc(dataHoraBR(m.data))}</span>
      </div>`;
  }

  /* ================= TELA: ESTOQUE ================= */

  async function telaEstoque(alvo, opcoes) {
    await recarregar();
    if (opcoes.filtroSituacao !== undefined) filtro.situacao = opcoes.filtroSituacao;

    alvo.innerHTML = `
      <div class="busca">
        <span class="ico" aria-hidden="true">🔎</span>
        <input type="search" id="busca" placeholder="Buscar por nome ou código"
               value="${esc(filtro.texto)}" autocomplete="off">
      </div>

      <div class="chips" role="group" aria-label="Filtrar por situação">
        <button type="button" class="chip" data-sit="" aria-pressed="${filtro.situacao === ''}">Todos</button>
        <button type="button" class="chip" data-sit="baixo" aria-pressed="${filtro.situacao === 'baixo'}">Acabando</button>
        <button type="button" class="chip" data-sit="falta" aria-pressed="${filtro.situacao === 'falta'}">Em falta</button>
        <button type="button" class="chip" data-sit="vencendo" aria-pressed="${filtro.situacao === 'vencendo'}">Vence logo</button>
        <button type="button" class="chip" data-sit="ok" aria-pressed="${filtro.situacao === 'ok'}">Ok</button>
      </div>

      <div class="linha">
        <div>
          <label for="f-cat">Categoria</label>
          <select id="f-cat">
            <option value="">Todas</option>
            ${CATEGORIAS.map((c) => `<option ${filtro.categoria === c ? 'selected' : ''}>${c}</option>`).join('')}
          </select>
        </div>
        <div>
          <label for="f-loc">Local</label>
          <select id="f-loc">
            <option value="">Todos</option>
            ${LOCAIS.map((l) => `<option ${filtro.local === l ? 'selected' : ''}>${l}</option>`).join('')}
          </select>
        </div>
      </div>

      <button type="button" class="btn btn--primario btn--bloco" data-novo-item>＋ Cadastrar item</button>

      <div class="chips" role="group" aria-label="Modo de exibição" style="margin-top:.65rem">
        <button type="button" class="chip" data-visao="detalhada" aria-pressed="${visaoEstoque === 'detalhada'}">Detalhada</button>
        <button type="button" class="chip" data-visao="simples" aria-pressed="${visaoEstoque === 'simples'}">Simples</button>
      </div>

      <div id="lista-estoque"></div>`;

    renderListaEstoque();

    alvo.querySelectorAll('[data-visao]').forEach((b) => b.addEventListener('click', () => {
      visaoEstoque = b.dataset.visao;
      try { localStorage.setItem('estoque-casa:v1:visao', visaoEstoque); } catch (e) {}
      alvo.querySelectorAll('[data-visao]').forEach((x) =>
        x.setAttribute('aria-pressed', String(x.dataset.visao === visaoEstoque)));
      renderListaEstoque();
    }));

    $('#busca').addEventListener('input', (e) => {
      filtro.texto = e.target.value; renderListaEstoque();
    });
    $('#f-cat').addEventListener('change', (e) => {
      filtro.categoria = e.target.value; renderListaEstoque();
    });
    $('#f-loc').addEventListener('change', (e) => {
      filtro.local = e.target.value; renderListaEstoque();
    });
  }

  function itensFiltrados() {
    const t = filtro.texto.trim().toLowerCase();
    return itens.filter((i) => {
      if (t && !(String(i.nome).toLowerCase().includes(t) || String(i.ean || '').includes(t))) return false;
      if (filtro.categoria && i.categoria !== filtro.categoria) return false;
      if (filtro.local && i.local !== filtro.local) return false;
      if (filtro.situacao) {
        const s = situacao(i);
        if (filtro.situacao === 'baixo'    && !(s === 'baixo' || s === 'falta')) return false;
        if (filtro.situacao === 'vencendo' && !(s === 'vencendo' || s === 'vencido')) return false;
        if (filtro.situacao === 'falta'    && s !== 'falta') return false;
        if (filtro.situacao === 'ok'       && s !== 'ok') return false;
      }
      return true;
    });
  }

  function renderListaEstoque() {
    const lista = itensFiltrados();
    const alvo = $('#lista-estoque');
    if (!alvo) return;
    if (!lista.length) {
      alvo.innerHTML = `
        <div class="vazio">
          <span class="ico" aria-hidden="true">🔍</span>
          <h3>Nenhum item encontrado</h3>
          <p>Ajuste a busca ou os filtros.</p>
        </div>`;
      return;
    }
    if (visaoEstoque === 'simples') { alvo.innerHTML = listaSimples(lista); return; }
    alvo.innerHTML = `<ul class="lista">${lista.map(linhaItem).join('')}</ul>`;
  }

  /** Visão simples: uma linha por item, agrupado por local, ordem alfabética.
   *  O ponto colorido carrega a situação; tocar na linha abre o item normal
   *  (o clique é o mesmo data-abrir-item da visão detalhada, já delegado). */
  function listaSimples(lista) {
    const ICONE = { Despensa: '🥫', Geladeira: '🧊', Freezer: '❄️', 'Armário': '🗄️',
                    Lavanderia: '🧺', Banheiro: '🧴', Outro: '📦' };
    const balde = (i) => (LOCAIS.includes(i.local) ? i.local : 'Outro');
    const grupos = LOCAIS
      .map((l) => ({
        local: l,
        itens: lista.filter((i) => balde(i) === l)
                    .sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR'))
      }))
      .filter((g) => g.itens.length);

    return grupos.map((g) => `
      <details class="grupo" open>
        <summary>${ICONE[g.local] || '📦'} ${esc(g.local)} <span class="grupo__n">${g.itens.length}</span></summary>
        <ul class="lista-s">
          ${g.itens.map((i) => {
            const s = situacao(i);
            return `
            <li data-abrir-item="${esc(i.id)}" role="button" tabindex="0"
                title="${esc(ROTULO_SIT[s] || 'Ok')}">
              <span class="ponto ponto--${s}" aria-hidden="true"></span>
              <span class="item-s__nome">${esc(i.nome)}</span>
              <span class="item-s__qtd">${qtd(i.quantidade)} ${esc(i.unidade || 'un')}</span>
            </li>`;
          }).join('')}
        </ul>
      </details>`).join('');
  }

  function linhaItem(i) {
    const s = situacao(i);
    const d = diasAte(i.validade);
    const tag = s === 'ok' ? '' : `<span class="tag tag--${s}">${ROTULO_SIT[s]}</span>`;
    const meta = [
      i.local,
      Store.num(i.minimo) > 0 ? `mín. ${qtd(i.minimo)}` : '',
      i.validade ? (d < 0 ? `venceu ${dataBR(i.validade)}` : `vence ${dataBR(i.validade)}`) : ''
    ].filter(Boolean).join(' · ');

    return `
      <li>
        <div class="item item--${s}">
          <div class="item__info" data-abrir-item="${esc(i.id)}" role="button" tabindex="0">
            <div class="item__nome">${esc(i.nome)}</div>
            <div class="item__meta">${tag}${esc(meta)}</div>
          </div>
          <div class="item__qtd">
            <b>${qtd(i.quantidade)}</b>
            <span>${esc(i.unidade || 'un')}</span>
          </div>
          <div class="item__botoes">
            <button type="button" class="redondo" data-menos="${esc(i.id)}"
                    aria-label="Dar baixa de 1 em ${esc(i.nome)}"
                    ${Store.num(i.quantidade) <= 0 ? 'disabled' : ''}>−</button>
            <button type="button" class="redondo redondo--mais" data-mais="${esc(i.id)}"
                    aria-label="Adicionar 1 em ${esc(i.nome)}">＋</button>
          </div>
        </div>
      </li>`;
  }

  /* ================= FORMULÁRIO DE ITEM ================= */

  function formItem(item = {}, extras = {}) {
    const ehNovo = !item.id;
    abrirModal(ehNovo ? 'Novo item' : 'Editar item', `
      <form id="form-item" novalidate>
        <div class="campo">
          <label for="i-nome">Nome *</label>
          <input id="i-nome" type="text" required value="${esc(item.nome || extras.nome || '')}"
                 placeholder="Ex.: Arroz branco 5 kg">
        </div>

        <div class="linha">
          <div>
            <label for="i-qtd">Quantidade</label>
            <input id="i-qtd" type="number" inputmode="decimal" step="any" min="0"
                   value="${item.quantidade ?? 1}">
          </div>
          <div>
            <label for="i-un">Unidade</label>
            <select id="i-un">
              ${UNIDADES.map((u) => `<option ${((item.unidade || 'un') === u) ? 'selected' : ''}>${u}</option>`).join('')}
            </select>
          </div>
        </div>

        <div class="linha">
          <div>
            <label for="i-cat">Categoria</label>
            <select id="i-cat">
              ${CATEGORIAS.map((c) => `<option ${((item.categoria || extras.categoria || 'Alimentos') === c) ? 'selected' : ''}>${c}</option>`).join('')}
            </select>
          </div>
          <div>
            <label for="i-loc">Onde guarda</label>
            <select id="i-loc">
              ${LOCAIS.map((l) => `<option ${((item.local || 'Despensa') === l) ? 'selected' : ''}>${l}</option>`).join('')}
            </select>
          </div>
        </div>

        <div class="linha">
          <div>
            <label for="i-min">Quantidade mínima</label>
            <input id="i-min" type="number" inputmode="decimal" step="any" min="0"
                   value="${item.minimo ?? 1}">
          </div>
          <div>
            <label for="i-val">Validade</label>
            <input id="i-val" type="date" value="${esc(item.validade || '')}">
          </div>
        </div>
        <div class="dica">Ao chegar na quantidade mínima, o item entra sozinho na lista de compras.</div>

        <div class="campo">
          <label for="i-ean">Código de barras</label>
          <input id="i-ean" type="text" inputmode="numeric" value="${esc(item.ean || extras.ean || '')}"
                 placeholder="Opcional">
        </div>

        <div class="campo">
          <label for="i-obs">Observações</label>
          <textarea id="i-obs" placeholder="Opcional">${esc(item.observacoes || '')}</textarea>
        </div>

        <div class="modal__rodape">
          ${ehNovo ? '<button type="button" class="btn" data-fechar>Cancelar</button>'
                   : `<button type="button" class="btn btn--perigo" data-excluir="${esc(item.id)}">Excluir</button>`}
          <button type="submit" class="btn btn--primario">Salvar</button>
        </div>
      </form>`, (w) => {

      w.querySelector('#form-item').addEventListener('submit', async (e) => {
        e.preventDefault();
        try {
          const salvo = await Store.salvarItem({
            id: item.id,
            nome: w.querySelector('#i-nome').value,
            quantidade: w.querySelector('#i-qtd').value,
            unidade: w.querySelector('#i-un').value,
            categoria: w.querySelector('#i-cat').value,
            local: w.querySelector('#i-loc').value,
            minimo: w.querySelector('#i-min').value,
            validade: w.querySelector('#i-val').value || null,
            ean: w.querySelector('#i-ean').value,
            observacoes: w.querySelector('#i-obs').value
          });
          await Store.sincronizarListaCompras(salvo);
          fecharModal();
          toast(ehNovo ? 'Item cadastrado.' : 'Item atualizado.', 'ok');
          await render();
        } catch (err) {
          toast(err.message, 'erro');
        }
      });

      w.querySelector('[data-excluir]')?.addEventListener('click', () => {
        confirmar('Excluir item', `Excluir "${item.nome}" e todo o histórico dele?`, async () => {
          await Store.excluirItem(item.id);
          toast('Item excluído.');
          await render();
        }, 'Excluir');
      });
    });
  }

  /* ================= DETALHE DO ITEM ================= */

  async function detalheItem(id) {
    const item = itens.find((x) => x.id === id);
    if (!item) return;
    const movs = (await Store.listarMovimentos({ itemId: id })).slice(0, 15);
    const s = situacao(item);
    const d = diasAte(item.validade);

    abrirModal(item.nome, `
      <div class="item item--${s}" style="box-shadow:none;margin-bottom:1rem">
        <div class="item__info" style="cursor:default">
          <div class="item__nome">${ROTULO_SIT[s]}</div>
          <div class="item__meta">${esc([item.categoria, item.local].filter(Boolean).join(' · '))}</div>
        </div>
        <div class="item__qtd"><b>${qtd(item.quantidade)}</b><span>${esc(item.unidade)}</span></div>
      </div>

      <div class="acoes-rapidas" style="margin-bottom:1rem">
        <button type="button" class="acao-grande" data-mov="saida"><span class="ico" aria-hidden="true">📤</span>Dar baixa</button>
        <button type="button" class="acao-grande" data-mov="entrada"><span class="ico" aria-hidden="true">📥</span>Repor</button>
      </div>

      <table class="tabela-dados">
        <tbody>
          <tr><th>Quantidade mínima</th><td>${qtd(item.minimo)} ${esc(item.unidade)}</td></tr>
          ${item.validade ? `<tr><th>Validade</th><td>${dataBR(item.validade)}${
            d !== null ? (d < 0 ? ' (vencido)' : ` (em ${d} dia${d === 1 ? '' : 's'})`) : ''}</td></tr>` : ''}
          ${item.ean ? `<tr><th>Código de barras</th><td>${esc(item.ean)}</td></tr>` : ''}
          ${item.observacoes ? `<tr><th>Observações</th><td>${esc(item.observacoes)}</td></tr>` : ''}
        </tbody>
      </table>

      <h3 style="margin-top:1.2rem">Histórico</h3>
      <div style="margin-top:.4rem">
        ${movs.length ? movs.map((m) => `
          <div class="mov">
            <span class="mov__qtd mov__qtd--${esc(m.tipo)}">${m.tipo === 'entrada' ? '+' : m.tipo === 'saida' ? '−' : '='}${qtd(m.quantidade)}</span>
            <span class="mov__nome">${esc(m.motivo || ({entrada:'Compra',saida:'Consumo',ajuste:'Ajuste'}[m.tipo]))} · ${esc(m.usuario_nome || '')}</span>
            <span class="mov__data">${esc(dataHoraBR(m.data))}</span>
          </div>`).join('')
        : '<p style="color:var(--text-2);font-size:.88rem">Sem movimentações.</p>'}
      </div>

      <div class="modal__rodape">
        <button type="button" class="btn" data-editar>Editar</button>
        <button type="button" class="btn btn--primario" data-ajuste>Ajustar estoque</button>
      </div>`, (w) => {
      w.querySelector('[data-mov="saida"]').onclick   = () => movimentar(item, 'saida');
      w.querySelector('[data-mov="entrada"]').onclick = () => movimentar(item, 'entrada');
      w.querySelector('[data-editar]').onclick        = () => formItem(item);
      w.querySelector('[data-ajuste]').onclick        = () => movimentar(item, 'ajuste');
    });
  }

  /* ================= MOVIMENTAÇÃO ================= */

  function movimentar(item, tipo) {
    const titulos = { entrada: 'Repor estoque', saida: 'Dar baixa', ajuste: 'Ajustar estoque' };
    const inicial = tipo === 'ajuste' ? Store.num(item.quantidade) : 1;

    abrirModal(titulos[tipo], `
      <p style="color:var(--text-2);font-size:.9rem">
        ${esc(item.nome)} — hoje há <strong>${qtd(item.quantidade)} ${esc(item.unidade)}</strong> em estoque.
      </p>

      <div class="contador">
        <button type="button" class="redondo" data-passo="-1" aria-label="Diminuir">−</button>
        <input type="number" id="m-qtd" inputmode="decimal" step="any" min="0" value="${inicial}"
               aria-label="Quantidade">

    try {
      await Store.movimentar({
        item,
        tipo: passo > 0 ? 'entrada' : 'saida',
        quantidade: 1,
        motivo: passo > 0 ? 'Reposição rápida' : 'Consumo rápido'

      await recarregar();
      if (tela === 'estoque') renderListaEstoque();
      else await render();
      toast(`${item.nome}: ${passo > 0 ? '+' : '−'}1`);

    abrirModal('Dar baixa', `

        w.querySelector('#lista-rapida').innerHTML = l.length

          <h3>Aponte a câmera para o código</h3>

        </p>

        <p class="mira" id="foto-status"></p>
